# ── Ingress (nginx Ingress Controller) ───────────────────────────────────────
# 사전 요건: nginx Ingress Controller 설치
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/cloud/deploy.yaml
#
# host 값을 실제 도메인 또는 클러스터 IP로 교체하세요.
#   예) odata-api.your-cluster.example.com
#
# TLS 설정:
#   - cert-manager 사용 시: tls 섹션 주석 해제 + annotations의 cert-manager 항목 활성화
#   - 수동 Secret 사용 시: tls 섹션 주석 해제 후 secretName에 TLS Secret 이름 입력
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: odata-api
  namespace: sample-apis
  labels:
    app: odata-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # cert-manager 자동 TLS 발급 (사용 시 주석 해제)
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: odata-api.your-cluster.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odata-api
                port:
                  number: 3003
  # TLS 섹션 (HTTPS 사용 시 주석 해제)
  # tls:
  #   - hosts:
  #       - odata-api.your-cluster.example.com
  #     secretName: odata-api-tls
