openapi: "3.0.3"

info:
  title: OData 4.0 Product Catalog API
  version: "1.0.0"
  description: |
    OData 4.0 프로토콜을 준수하는 제품 카탈로그 API입니다.
    IBM API Connect 등록용 샘플로 설계되었으며, OData 핵심 쿼리 옵션을 시연합니다.

    ## OData 4.0 지원 기능
    - **`$filter`** — 조건 필터링 (`eq`, `ne`, `gt`, `ge`, `lt`, `le`, `and`, `or`, `contains`, `startswith`, `endswith`)
    - **`$select`** — 반환 필드 선택
    - **`$orderby`** — 정렬 (`asc` / `desc`, 복수 필드 지원)
    - **`$top`** — 최대 반환 개수 (페이징)
    - **`$skip`** — 건너뛸 항목 수 (페이징)
    - **`$count`** — 총 건수 포함 (`$count=true`)
    - **`$expand`** — 연관 엔티티 인라인 확장
    - **`/$count`** — 엔티티 셋의 원시 카운트 값 반환
    - **`/$metadata`** — CSDL (Common Schema Definition Language) XML 문서

    ## 데이터 저장
    In-memory 저장소를 사용하며, 서버 재시작 시 초기 데이터로 리셋됩니다.

    ## OData 응답 형식
    모든 컬렉션 응답은 `@odata.context`와 `value` 배열을 포함합니다.
    단건 응답은 `@odata.context`와 `@odata.id`를 포함합니다.

  contact:
    name: IBM API Connect Sample
    url: https://www.ibm.com/products/api-connect
  license:
    name: MIT

servers:
  - url: http://localhost:3003
    description: 로컬 개발 서버
  - url: https://odata-api.apps.your-cluster.example.com
    description: OpenShift 배포 (Route)
  - url: https://odata-api.your-cluster.example.com
    description: Kubernetes 배포 (Ingress)

tags:
  - name: Service
    description: OData 서비스 문서 및 메타데이터
  - name: Health
    description: 서버 상태 확인
  - name: Products
    description: 제품 엔티티 셋 — OData 4.0 CRUD + 쿼리 옵션
  - name: Categories
    description: 카테고리 엔티티 셋 — OData 4.0 CRUD + 네비게이션 프로퍼티

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Service Document ─────────────────────────────────────────────────────────
  /:
    get:
      tags: [Service]
      summary: OData 서비스 문서
      operationId: getServiceDocument
      description: |
        OData 서비스 루트 — 사용 가능한 엔티티 셋 목록을 반환합니다.
        OData 클라이언트는 이 엔드포인트를 통해 서비스 구조를 파악합니다.
      responses:
        "200":
          description: OData 서비스 문서
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceDocument"
              example:
                "@odata.context": "http://localhost:3003/$metadata"
                value:
                  - name: Products
                    kind: EntitySet
                    url:  Products
                  - name: Categories
                    kind: EntitySet
                    url:  Categories

  /$metadata:
    get:
      tags: [Service]
      summary: OData $metadata (CSDL)
      operationId: getMetadata
      description: |
        OData 4.0 Common Schema Definition Language (CSDL) XML 문서를 반환합니다.
        엔티티 타입, 프로퍼티, 네비게이션 프로퍼티, 엔티티 컨테이너를 정의합니다.
        OData 클라이언트(Excel, Power BI, SAP 등)는 이 문서를 기반으로 스키마를 파악합니다.
      responses:
        "200":
          description: CSDL XML 문서
          content:
            application/xml:
              schema:
                type: string
                format: xml

  # ── Health ──────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [Health]
      summary: 서버 상태 확인
      operationId: getHealth
      description: 서버가 정상 동작 중인지 확인합니다. 로드밸런서 헬스체크에 사용됩니다.
      responses:
        "200":
          description: 서버 정상 동작 중
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                timestamp: "2024-11-15T09:00:00.000Z"

  # ── Products ─────────────────────────────────────────────────────────────────
  /Products:
    get:
      tags: [Products]
      summary: 제품 목록 조회 (OData 쿼리 옵션 지원)
      operationId: listProducts
      description: |
        전체 제품 목록을 조회합니다. OData 4.0 시스템 쿼리 옵션을 지원합니다.

        **$filter 예시:**
        - `$filter=categoryId eq 1` — Electronics 제품만
        - `$filter=price lt 50` — 50달러 미만
        - `$filter=discontinued eq false` — 판매 중인 제품
        - `$filter=price ge 100 and price le 300` — 100~300달러 범위
        - `$filter=contains(name,'Pro')` — 이름에 'Pro' 포함
        - `$filter=rating gt 4.5 and stock gt 0` — 평점 4.5 초과, 재고 있음

        **$orderby 예시:**
        - `$orderby=price asc` — 가격 오름차순
        - `$orderby=rating desc,name asc` — 평점 내림차순, 이름 오름차순

        **페이징 예시:**
        - `$top=5&$skip=0` — 1페이지 (5개)
        - `$top=5&$skip=5` — 2페이지
        - `$count=true` — 응답에 `@odata.count` 포함

        **$expand 예시:**
        - `$expand=Category` — 제품에 카테고리 정보 인라인

        **$select 예시:**
        - `$select=id,name,price` — 특정 필드만 반환
      parameters:
        - $ref: "#/components/parameters/ODataFilter"
        - $ref: "#/components/parameters/ODataSelect"
        - $ref: "#/components/parameters/ODataOrderby"
        - $ref: "#/components/parameters/ODataTop"
        - $ref: "#/components/parameters/ODataSkip"
        - $ref: "#/components/parameters/ODataCount"
        - $ref: "#/components/parameters/ODataExpand"
      responses:
        "200":
          description: OData 제품 컬렉션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCollection"
              examples:
                allProducts:
                  summary: 전체 목록 (기본)
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Products"
                    value:
                      - id: 1
                        name: "Wireless Bluetooth Headphones"
                        description: "Over-ear headphones with active noise cancellation"
                        price: 249.99
                        stock: 120
                        rating: 4.5
                        categoryId: 1
                        createdAt: "2024-01-10T08:00:00Z"
                        discontinued: false
                      - id: 2
                        name: "USB-C Laptop Charger"
                        description: "65W USB-C fast charger compatible with most laptops"
                        price: 49.99
                        stock: 350
                        rating: 4.2
                        categoryId: 1
                        createdAt: "2024-02-05T09:30:00Z"
                        discontinued: false
                withCount:
                  summary: $count=true — 총 건수 포함
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Products"
                    "@odata.count": 10
                    value:
                      - id: 1
                        name: "Wireless Bluetooth Headphones"
                        price: 249.99
                        stock: 120
                        categoryId: 1
                        discontinued: false
                withExpand:
                  summary: $expand=Category — 카테고리 인라인
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Products"
                    value:
                      - id: 1
                        name: "Wireless Bluetooth Headphones"
                        price: 249.99
                        stock: 120
                        categoryId: 1
                        discontinued: false
                        Category:
                          id: 1
                          name: Electronics
                          description: "Electronic devices and accessories"
                withSelect:
                  summary: $select=id,name,price — 필드 선택
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Products"
                    value:
                      - id: 1
                        name: "Wireless Bluetooth Headphones"
                        price: 249.99
                        stock: 120
                        categoryId: 1
                        discontinued: false
                      - id: 2
                        name: "USB-C Laptop Charger"
                        price: 49.99
                        stock: 350
                        categoryId: 1
                        discontinued: false

    post:
      tags: [Products]
      summary: 제품 생성
      operationId: createProduct
      description: |
        새 제품을 생성합니다.

        **필수 필드:** `name`, `price`, `categoryId`

        성공 시 `201 Created`와 `Location` 헤더를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
            examples:
              electronics:
                summary: 전자제품 등록
                value:
                  name: "Wireless Mouse"
                  description: "Ergonomic wireless mouse with silent click"
                  price: 29.99
                  stock: 200
                  rating: 4.3
                  categoryId: 1
                  discontinued: false
              requiredOnly:
                summary: 필수 필드만
                value:
                  name: "New Product"
                  price: 19.99
                  categoryId: 2
      responses:
        "201":
          description: 제품 생성 성공
          headers:
            Location:
              description: 생성된 제품의 OData canonical URL
              schema:
                type: string
                example: "http://localhost:3003/Products(11)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEntity"
              example:
                "@odata.context": "http://localhost:3003/$metadata#Products/$entity"
                "@odata.id": "http://localhost:3003/Products(11)"
                id: 11
                name: "Wireless Mouse"
                description: "Ergonomic wireless mouse with silent click"
                price: 29.99
                stock: 200
                rating: 4.3
                categoryId: 1
                createdAt: "2024-11-15T09:00:00.000Z"
                discontinued: false
        "400":
          $ref: "#/components/responses/ODataBadRequest"
        "404":
          $ref: "#/components/responses/ODataNotFound"

  /Products/$count:
    get:
      tags: [Products]
      summary: 제품 수 조회
      operationId: countProducts
      description: |
        필터 조건에 맞는 제품의 수를 순수 정수 텍스트로 반환합니다.
        `$filter` 와 함께 사용할 수 있습니다.

        예: `GET /Products/$count?$filter=categoryId eq 1`
      parameters:
        - $ref: "#/components/parameters/ODataFilter"
      responses:
        "200":
          description: 제품 수 (plain text integer)
          content:
            text/plain:
              schema:
                type: integer
              example: 10

  /Products/{id}:
    parameters:
      - $ref: "#/components/parameters/PathProductId"

    get:
      tags: [Products]
      summary: 제품 단건 조회
      operationId: getProduct
      description: |
        ID로 단일 제품을 조회합니다.

        OData canonical 키 형식: `/Products(1)`
        편의 형식도 지원: `/Products/1`

        `$expand=Category`, `$select` 쿼리 옵션을 지원합니다.
      parameters:
        - $ref: "#/components/parameters/ODataSelect"
        - $ref: "#/components/parameters/ODataExpand"
      responses:
        "200":
          description: 제품 단건
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductEntity"
              examples:
                basic:
                  summary: 기본 조회
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Products/$entity"
                    "@odata.id": "http://localhost:3003/Products(1)"
                    id: 1
                    name: "Wireless Bluetooth Headphones"
                    description: "Over-ear headphones with active noise cancellation"
                    price: 249.99
                    stock: 120
                    rating: 4.5
                    categoryId: 1
                    createdAt: "2024-01-10T08:00:00Z"
                    discontinued: false
                withExpandCategory:
                  summary: $expand=Category
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Products/$entity"
                    "@odata.id": "http://localhost:3003/Products(1)"
                    id: 1
                    name: "Wireless Bluetooth Headphones"
                    price: 249.99
                    stock: 120
                    categoryId: 1
                    discontinued: false
                    Category:
                      id: 1
                      name: Electronics
                      description: "Electronic devices and accessories"
        "404":
          $ref: "#/components/responses/ODataNotFound"

    patch:
      tags: [Products]
      summary: 제품 부분 수정 (OData PATCH)
      operationId: updateProduct
      description: |
        제품의 특정 필드만 업데이트합니다 (OData PATCH 시맨틱스).
        수정하지 않을 필드는 요청 본문에서 생략합니다.

        **주의:** 엔티티 키(`id`) 변경은 허용되지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatchRequest"
            examples:
              updatePrice:
                summary: 가격 변경
                value:
                  price: 199.99
              discontinue:
                summary: 제품 단종 처리
                value:
                  discontinued: true
                  stock: 0
              updateStock:
                summary: 재고 업데이트
                value:
                  stock: 50
      responses:
        "204":
          description: 수정 성공 (No Content)
        "400":
          $ref: "#/components/responses/ODataBadRequest"
        "404":
          $ref: "#/components/responses/ODataNotFound"

    put:
      tags: [Products]
      summary: 제품 전체 교체 (OData PUT)
      operationId: replaceProduct
      description: |
        제품의 모든 필드를 교체합니다 (OData PUT 시맨틱스).
        **필수 필드:** `name`, `price`, `categoryId`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
            example:
              name: "Wireless Bluetooth Headphones (2nd Gen)"
              description: "Next-gen over-ear headphones with spatial audio"
              price: 279.99
              stock: 80
              rating: 4.7
              categoryId: 1
              discontinued: false
      responses:
        "204":
          description: 교체 성공 (No Content)
        "400":
          $ref: "#/components/responses/ODataBadRequest"
        "404":
          $ref: "#/components/responses/ODataNotFound"

    delete:
      tags: [Products]
      summary: 제품 삭제
      operationId: deleteProduct
      description: 제품을 삭제합니다. 성공 시 `204 No Content`를 반환합니다.
      responses:
        "204":
          description: 삭제 성공 (No Content)
        "404":
          $ref: "#/components/responses/ODataNotFound"

  # ── Categories ───────────────────────────────────────────────────────────────
  /Categories:
    get:
      tags: [Categories]
      summary: 카테고리 목록 조회 (OData 쿼리 옵션 지원)
      operationId: listCategories
      description: |
        전체 카테고리 목록을 조회합니다. OData 4.0 시스템 쿼리 옵션을 지원합니다.

        **$expand=Products** 를 사용하면 각 카테고리에 속한 제품 목록이 인라인됩니다.
      parameters:
        - $ref: "#/components/parameters/ODataFilter"
        - $ref: "#/components/parameters/ODataSelect"
        - $ref: "#/components/parameters/ODataOrderby"
        - $ref: "#/components/parameters/ODataTop"
        - $ref: "#/components/parameters/ODataSkip"
        - $ref: "#/components/parameters/ODataCount"
        - $ref: "#/components/parameters/ODataExpand"
      responses:
        "200":
          description: OData 카테고리 컬렉션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryCollection"
              examples:
                allCategories:
                  summary: 전체 목록
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Categories"
                    value:
                      - id: 1
                        name: Electronics
                        description: "Electronic devices and accessories"
                      - id: 2
                        name: Books
                        description: "Physical and digital books"
                withProducts:
                  summary: $expand=Products — 제품 목록 인라인
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Categories"
                    value:
                      - id: 2
                        name: Books
                        description: "Physical and digital books"
                        Products:
                          - id: 4
                            name: "Clean Code"
                            price: 39.99
                            stock: 200
                            categoryId: 2
                            discontinued: false
                          - id: 5
                            name: "The Pragmatic Programmer"
                            price: 44.99
                            stock: 150
                            categoryId: 2
                            discontinued: false

    post:
      tags: [Categories]
      summary: 카테고리 생성
      operationId: createCategory
      description: |
        새 카테고리를 생성합니다.

        **필수 필드:** `name`

        동일한 이름의 카테고리가 이미 존재하면 `409 Conflict`를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
            example:
              name: "Toys & Games"
              description: "Children toys and board games"
      responses:
        "201":
          description: 카테고리 생성 성공
          headers:
            Location:
              description: 생성된 카테고리의 OData canonical URL
              schema:
                type: string
                example: "http://localhost:3003/Categories(6)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEntity"
              example:
                "@odata.context": "http://localhost:3003/$metadata#Categories/$entity"
                "@odata.id": "http://localhost:3003/Categories(6)"
                id: 6
                name: "Toys & Games"
                description: "Children toys and board games"
        "400":
          $ref: "#/components/responses/ODataBadRequest"
        "409":
          $ref: "#/components/responses/ODataConflict"

  /Categories/$count:
    get:
      tags: [Categories]
      summary: 카테고리 수 조회
      operationId: countCategories
      description: 카테고리의 수를 순수 정수 텍스트로 반환합니다.
      parameters:
        - $ref: "#/components/parameters/ODataFilter"
      responses:
        "200":
          description: 카테고리 수 (plain text integer)
          content:
            text/plain:
              schema:
                type: integer
              example: 5

  /Categories/{id}:
    parameters:
      - $ref: "#/components/parameters/PathCategoryId"

    get:
      tags: [Categories]
      summary: 카테고리 단건 조회
      operationId: getCategory
      description: |
        ID로 단일 카테고리를 조회합니다.
        `$expand=Products` 를 사용하면 카테고리에 속한 제품 목록이 인라인됩니다.
      parameters:
        - $ref: "#/components/parameters/ODataSelect"
        - $ref: "#/components/parameters/ODataExpand"
      responses:
        "200":
          description: 카테고리 단건
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryEntity"
              examples:
                basic:
                  summary: 기본 조회
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Categories/$entity"
                    "@odata.id": "http://localhost:3003/Categories(1)"
                    id: 1
                    name: Electronics
                    description: "Electronic devices and accessories"
                withProducts:
                  summary: $expand=Products
                  value:
                    "@odata.context": "http://localhost:3003/$metadata#Categories/$entity"
                    "@odata.id": "http://localhost:3003/Categories(1)"
                    id: 1
                    name: Electronics
                    description: "Electronic devices and accessories"
                    Products:
                      - id: 1
                        name: "Wireless Bluetooth Headphones"
                        price: 249.99
                        stock: 120
                        categoryId: 1
                        discontinued: false
        "404":
          $ref: "#/components/responses/ODataNotFound"

    patch:
      tags: [Categories]
      summary: 카테고리 부분 수정 (OData PATCH)
      operationId: updateCategory
      description: 카테고리의 특정 필드만 업데이트합니다. 키(`id`) 변경은 허용되지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatchRequest"
            example:
              description: "Consumer electronics, gadgets and accessories"
      responses:
        "204":
          description: 수정 성공 (No Content)
        "400":
          $ref: "#/components/responses/ODataBadRequest"
        "404":
          $ref: "#/components/responses/ODataNotFound"

    delete:
      tags: [Categories]
      summary: 카테고리 삭제
      operationId: deleteCategory
      description: |
        카테고리를 삭제합니다.

        **주의:** 연결된 제품이 있는 카테고리는 삭제할 수 없습니다.
        먼저 제품을 다른 카테고리로 이동하거나 삭제한 후 시도하세요.
      responses:
        "204":
          description: 삭제 성공 (No Content)
        "404":
          $ref: "#/components/responses/ODataNotFound"
        "409":
          $ref: "#/components/responses/ODataConflict"

  /Categories/{id}/Products:
    parameters:
      - $ref: "#/components/parameters/PathCategoryId"

    get:
      tags: [Categories]
      summary: 카테고리별 제품 목록 (네비게이션 프로퍼티)
      operationId: listProductsByCategory
      description: |
        특정 카테고리에 속한 제품 목록을 조회합니다.
        OData 네비게이션 프로퍼티 패턴: `/Categories(1)/Products`

        `$filter`, `$orderby`, `$top`, `$skip`, `$count`, `$select` 지원합니다.
      parameters:
        - $ref: "#/components/parameters/ODataFilter"
        - $ref: "#/components/parameters/ODataSelect"
        - $ref: "#/components/parameters/ODataOrderby"
        - $ref: "#/components/parameters/ODataTop"
        - $ref: "#/components/parameters/ODataSkip"
        - $ref: "#/components/parameters/ODataCount"
      responses:
        "200":
          description: 해당 카테고리의 제품 컬렉션
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCollection"
              example:
                "@odata.context": "http://localhost:3003/$metadata#Categories(1)/Products"
                value:
                  - id: 1
                    name: "Wireless Bluetooth Headphones"
                    price: 249.99
                    stock: 120
                    categoryId: 1
                    discontinued: false
                  - id: 2
                    name: "USB-C Laptop Charger"
                    price: 49.99
                    stock: 350
                    categoryId: 1
                    discontinued: false
        "404":
          $ref: "#/components/responses/ODataNotFound"

# ─────────────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────────────
components:

  # ── Schemas ──────────────────────────────────────────────────────────────────
  schemas:

    Product:
      type: object
      description: 제품 엔티티
      required:
        - id
        - name
        - price
        - stock
        - categoryId
        - discontinued
      properties:
        id:
          type: integer
          description: 제품 고유 키 (서버 자동 생성)
          example: 1
          readOnly: true
        name:
          type: string
          description: 제품명
          maxLength: 200
          example: "Wireless Bluetooth Headphones"
        description:
          type: string
          description: 제품 설명
          example: "Over-ear headphones with active noise cancellation"
        price:
          type: number
          format: double
          description: 제품 가격 (USD)
          minimum: 0
          example: 249.99
        stock:
          type: integer
          description: 재고 수량
          minimum: 0
          example: 120
        rating:
          type: number
          format: double
          description: 평균 평점 (1.0–5.0)
          minimum: 1.0
          maximum: 5.0
          nullable: true
          example: 4.5
        categoryId:
          type: integer
          description: 카테고리 외래키
          example: 1
        createdAt:
          type: string
          format: date-time
          description: 생성 일시 (ISO 8601)
          readOnly: true
          example: "2024-01-10T08:00:00Z"
        discontinued:
          type: boolean
          description: 단종 여부
          example: false

    ProductEntity:
      allOf:
        - type: object
          properties:
            "@odata.context":
              type: string
              description: OData 컨텍스트 URL
              example: "http://localhost:3003/$metadata#Products/$entity"
            "@odata.id":
              type: string
              description: 엔티티 식별 URL
              example: "http://localhost:3003/Products(1)"
        - $ref: "#/components/schemas/Product"

    ProductCollection:
      type: object
      description: OData 제품 컬렉션 응답
      required:
        - "@odata.context"
        - value
      properties:
        "@odata.context":
          type: string
          example: "http://localhost:3003/$metadata#Products"
        "@odata.count":
          type: integer
          description: "$count=true 요청 시 포함 — 필터 후 전체 건수"
          example: 10
        value:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    ProductCreateRequest:
      type: object
      description: 제품 생성/교체 요청
      required:
        - name
        - price
        - categoryId
      properties:
        name:
          type: string
          maxLength: 200
          example: "Wireless Mouse"
        description:
          type: string
          example: "Ergonomic wireless mouse with silent click"
        price:
          type: number
          format: double
          minimum: 0
          example: 29.99
        stock:
          type: integer
          minimum: 0
          default: 0
          example: 200
        rating:
          type: number
          format: double
          minimum: 1.0
          maximum: 5.0
          nullable: true
          example: 4.3
        categoryId:
          type: integer
          example: 1
        discontinued:
          type: boolean
          default: false
          example: false

    ProductPatchRequest:
      type: object
      description: 제품 부분 수정 요청 (PATCH — 수정할 필드만 포함)
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
        price:
          type: number
          format: double
          minimum: 0
          example: 199.99
        stock:
          type: integer
          minimum: 0
          example: 50
        rating:
          type: number
          format: double
          minimum: 1.0
          maximum: 5.0
          nullable: true
        categoryId:
          type: integer
        discontinued:
          type: boolean
          example: true

    Category:
      type: object
      description: 카테고리 엔티티
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: 카테고리 고유 키 (서버 자동 생성)
          example: 1
          readOnly: true
        name:
          type: string
          description: 카테고리명
          maxLength: 100
          example: Electronics
        description:
          type: string
          description: 카테고리 설명
          example: "Electronic devices and accessories"

    CategoryEntity:
      allOf:
        - type: object
          properties:
            "@odata.context":
              type: string
              example: "http://localhost:3003/$metadata#Categories/$entity"
            "@odata.id":
              type: string
              example: "http://localhost:3003/Categories(1)"
        - $ref: "#/components/schemas/Category"

    CategoryCollection:
      type: object
      description: OData 카테고리 컬렉션 응답
      required:
        - "@odata.context"
        - value
      properties:
        "@odata.context":
          type: string
          example: "http://localhost:3003/$metadata#Categories"
        "@odata.count":
          type: integer
          description: "$count=true 요청 시 포함"
          example: 5
        value:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    CategoryCreateRequest:
      type: object
      description: 카테고리 생성 요청
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          example: "Toys & Games"
        description:
          type: string
          example: "Children toys and board games"

    CategoryPatchRequest:
      type: object
      description: 카테고리 부분 수정 요청 (PATCH)
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          example: "Consumer electronics, gadgets and accessories"

    ServiceDocument:
      type: object
      description: OData 서비스 문서
      required:
        - "@odata.context"
        - value
      properties:
        "@odata.context":
          type: string
          example: "http://localhost:3003/$metadata"
        value:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Products
              kind:
                type: string
                example: EntitySet
              url:
                type: string
                example: Products

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: "2024-11-15T09:00:00.000Z"

    ODataError:
      type: object
      description: OData 4.0 형식 에러 응답
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: 에러 코드
              example: ResourceNotFound
            message:
              type: string
              description: 에러 메시지
              example: "No Product with id 99"
            target:
              type: string
              description: 에러 대상 (선택)
              example: "Products(99)"

  # ── Parameters ───────────────────────────────────────────────────────────────
  parameters:

    PathProductId:
      name: id
      in: path
      required: true
      description: 제품 고유 ID (OData 키)
      schema:
        type: integer
      example: 1

    PathCategoryId:
      name: id
      in: path
      required: true
      description: 카테고리 고유 ID (OData 키)
      schema:
        type: integer
      example: 1

    ODataFilter:
      name: $filter
      in: query
      required: false
      description: |
        OData 4.0 필터 표현식.
        지원 연산자: `eq`, `ne`, `gt`, `ge`, `lt`, `le`, `and`, `or`
        지원 함수: `contains(field,'value')`, `startswith(field,'value')`, `endswith(field,'value')`
      schema:
        type: string
      examples:
        byCategory:
          value: "categoryId eq 1"
          summary: 특정 카테고리
        priceRange:
          value: "price ge 50 and price le 200"
          summary: 가격 범위
        available:
          value: "stock gt 0 and discontinued eq false"
          summary: 재고 있고 판매 중인 제품
        highRated:
          value: "rating gt 4.5"
          summary: 평점 4.5 초과
        containsName:
          value: "contains(name,'Pro')"
          summary: 이름에 'Pro' 포함

    ODataSelect:
      name: $select
      in: query
      required: false
      description: "반환할 필드명을 쉼표로 구분하여 지정합니다. 예: `id,name,price`"
      schema:
        type: string
      example: "id,name,price,stock"

    ODataOrderby:
      name: $orderby
      in: query
      required: false
      description: |
        정렬 기준. 필드명 뒤에 `asc` 또는 `desc` 를 지정합니다.
        복수 필드는 쉼표로 구분합니다.
      schema:
        type: string
      examples:
        priceAsc:
          value: "price asc"
          summary: 가격 오름차순
        ratingDesc:
          value: "rating desc"
          summary: 평점 내림차순
        multiField:
          value: "rating desc,name asc"
          summary: 평점 내림차순, 이름 오름차순

    ODataTop:
      name: $top
      in: query
      required: false
      description: "반환할 최대 항목 수 (페이지 크기)"
      schema:
        type: integer
        minimum: 1
      example: 5

    ODataSkip:
      name: $skip
      in: query
      required: false
      description: "건너뛸 항목 수 (페이지 오프셋). `$top`과 함께 사용합니다."
      schema:
        type: integer
        minimum: 0
      example: 0

    ODataCount:
      name: $count
      in: query
      required: false
      description: "`true` 로 설정하면 응답에 `@odata.count` (필터 후 전체 건수)가 포함됩니다."
      schema:
        type: string
        enum: ["true", "false"]
      example: "true"

    ODataExpand:
      name: $expand
      in: query
      required: false
      description: |
        인라인으로 확장할 네비게이션 프로퍼티 이름.
        - Products: `$expand=Category` (카테고리 정보 포함)
        - Categories: `$expand=Products` (제품 목록 포함)
      schema:
        type: string
      examples:
        expandCategory:
          value: "Category"
          summary: 제품 → 카테고리 확장
        expandProducts:
          value: "Products"
          summary: 카테고리 → 제품 목록 확장

  # ── Responses ─────────────────────────────────────────────────────────────────
  responses:

    ODataNotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ODataError"
          examples:
            productNotFound:
              summary: 제품 없음
              value:
                error:
                  code: ResourceNotFound
                  message: "No Product with id 99"
                  target: "Products(99)"
            categoryNotFound:
              summary: 카테고리 없음
              value:
                error:
                  code: ResourceNotFound
                  message: "No Category with id 99"
                  target: "Categories(99)"

    ODataBadRequest:
      description: 잘못된 요청 (필수 필드 누락 또는 키 변경 시도)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ODataError"
          examples:
            missingFields:
              summary: 필수 필드 누락
              value:
                error:
                  code: BadRequest
                  message: "name, price, and categoryId are required fields"
            keyModification:
              summary: 키 변경 시도
              value:
                error:
                  code: BadRequest
                  message: "Cannot modify the entity key (id)"

    ODataConflict:
      description: 충돌 (중복 이름 또는 연결된 리소스 존재)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ODataError"
          examples:
            duplicateName:
              summary: 카테고리 이름 중복
              value:
                error:
                  code: Conflict
                  message: "A Category with this name already exists"
                  name: Electronics
            linkedProducts:
              summary: 연결된 제품이 있어 삭제 불가
              value:
                error:
                  code: Conflict
                  message: "Cannot delete a Category that has associated Products"
                  linkedProducts: 4
