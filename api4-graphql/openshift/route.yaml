# TLS edge termination — OpenShift Router가 HTTPS를 처리하고 Pod에는 HTTP로 전달
# host 값을 실제 클러스터 도메인으로 교체하세요.
#   예) tours-graphql-api.apps.your-cluster.example.com
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: tours-graphql-api
  namespace: sample-apis
  labels:
    app: tours-graphql-api
spec:
  host: tours-graphql-api.apps.your-cluster.example.com
  to:
    kind: Service
    name: tours-graphql-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
