# Tours Management GraphQL API — Schema Definition Language (SDL)
# ================================================================
#
# 개요: 크루즈 여행사 관리 시스템을 위한 GraphQL API 스키마입니다.
# IBM API Connect 샘플로 설계되었으며, GraphQL의 핵심 기능을 모두 시연합니다:
#   - Query     : 단일/목록 조회, 연관 데이터 자동 fetch, 다중 필터
#   - Mutation  : 생성/수정/삭제, 입력 유효성 검사, 충돌 감지
#   - Subscription: 실시간 예약 이벤트 (개념적 선언)
#   - Custom Scalars: Date, DateTime, EmailAddress
#
# 도메인 모델:
#   Cruise (크루즈 상품) --> RoomType[]
#   Customer (고객)      --> Address
#   Booking (예약)       --> Cruise, Customer, BookedRoom
#
# 권한 모델 (API Connect 연동 시):
#   GUEST    : 크루즈 목록/상세 조회만 가능
#   CUSTOMER : 본인 예약 조회/생성/취소, 본인 정보 수정
#   AGENT    : 모든 고객/예약 조회 및 수정
#   ADMIN    : 모든 작업 (크루즈 관리 포함)

# ── Custom Scalars ─────────────────────────────────────────────────────────────

"""
ISO 8601 날짜 (YYYY-MM-DD 형식)
예: "2025-06-01"
"""
scalar Date

"""
ISO 8601 날짜+시간 (UTC, YYYY-MM-DDTHH:mm:ss.sssZ 형식)
예: "2024-11-01T08:00:00.000Z"
"""
scalar DateTime

"""
RFC 5322 이메일 주소 형식
예: "alice@tours.com"
"""
scalar EmailAddress

# ── Enums ─────────────────────────────────────────────────────────────────────

"""
예약 상태
"""
enum BookingStatus {
  """대기 중 — 결제 또는 확인 대기"""
  PENDING

  """확정됨 — 예약 확정 및 결제 완료"""
  CONFIRMED

  """취소됨 — 고객 또는 운영자에 의해 취소"""
  CANCELLED

  """완료됨 — 여행이 종료됨"""
  COMPLETED
}

"""
객실 유형 코드
"""
enum RoomTypeCode {
  """인테리어 캐빈 (창문 없음, 가장 경제적)"""
  INT

  """발코니 캐빈 (개인 발코니, 바다 전망)"""
  BAL

  """스위트 (별도 거실, 풀 오션뷰, 버틀러 서비스)"""
  STE
}

"""
통화 코드 (ISO 4217)
"""
enum Currency {
  """미국 달러"""
  USD

  """유로"""
  EUR

  """영국 파운드"""
  GBP

  """한국 원"""
  KRW
}

"""
정렬 방향
"""
enum SortDirection {
  """오름차순"""
  ASC

  """내림차순"""
  DESC
}

# ── Types ──────────────────────────────────────────────────────────────────────

"""
고객 주소 정보
"""
type Address {
  """도로명 주소"""
  street: String!

  """도시"""
  city: String!

  """주/도 (해당 없으면 빈 문자열)"""
  state: String

  """우편번호"""
  postalCode: String!

  """국가 코드 (ISO 3166-1 alpha-3, 예: USA, KOR, GBR)"""
  country: String!
}

"""
객실 유형 — 크루즈별로 정의된 객실 카테고리 및 가격 정보
"""
type RoomType {
  """객실 유형 코드"""
  roomID: RoomTypeCode!

  """객실 유형 이름 (예: Interior Cabin, Balcony Cabin, Suite)"""
  name: String!

  """객실 설명"""
  description: String!

  """최대 수용 인원"""
  maxOccupancy: Int!

  """1박당 가격"""
  pricePerNight: Float!

  """통화"""
  currency: Currency!
}

"""
크루즈 상품 — 항해 일정, 출발항, 객실 정보를 포함한 여행 상품
"""
type Cruise {
  """크루즈 고유 ID (예: CRUISE-001)"""
  cruiseID: ID!

  """크루즈 이름 (예: Mediterranean Discovery)"""
  title: String!

  """크루즈 설명"""
  description: String!

  """출발일 (YYYY-MM-DD)"""
  startDate: Date!

  """도착일 (YYYY-MM-DD)"""
  endDate: Date!

  """출발항 (예: Barcelona, Miami, Copenhagen)"""
  startPort: String!

  """항해 일수"""
  numDays: Int!

  """이 크루즈에서 제공되는 객실 유형 목록"""
  roomTypes: [RoomType!]!

  """이 크루즈의 모든 예약 (Agent/Admin 권한 필요)"""
  bookings: [Booking!]!

  """이 크루즈의 예약 수"""
  bookingCount: Int!
}

"""
고객 — 예약 주체가 되는 여행자 정보
"""
type Customer {
  """고객 고유 ID (이메일 주소)"""
  emailAddress: EmailAddress!

  """이름"""
  firstName: String!

  """성"""
  lastName: String!

  """전체 이름 (firstName + lastName 자동 조합)"""
  fullName: String!

  """연락처 전화번호"""
  phone: String!

  """거주 주소"""
  address: Address!

  """계정 생성 일시"""
  createdAt: DateTime!

  """이 고객의 모든 예약 목록"""
  bookings: [Booking!]!

  """이 고객의 예약 수"""
  bookingCount: Int!
}

"""
예약된 객실 정보
"""
type BookedRoom {
  """객실 유형 코드"""
  roomID: RoomTypeCode!

  """예약 객실 수"""
  numRooms: Int!

  """객실 상세 정보 (크루즈의 roomTypes에서 자동 조회)"""
  details: RoomType
}

"""
예약 — 고객과 크루즈를 연결하는 핵심 도메인 객체.
예약 생성 시 크루즈와 고객이 실제로 존재하는지 검증합니다.
"""
type Booking {
  """예약 고유 ID (자동 증가 정수)"""
  bookingID: ID!

  """예약 상태"""
  status: BookingStatus!

  """예약한 크루즈 상세 정보 (자동 조인)"""
  cruise: Cruise!

  """예약한 고객 상세 정보 (자동 조인)"""
  customer: Customer!

  """예약 객실 정보"""
  room: BookedRoom!

  """탑승 인원"""
  numPassengers: Int!

  """예약 생성 일시"""
  bookedAt: DateTime!

  """마지막 수정 일시"""
  updatedAt: DateTime
}

# ── Connection / Pagination Types ─────────────────────────────────────────────

"""
크루즈 목록 페이지네이션 결과
"""
type CruiseConnection {
  """전체 크루즈 수"""
  total: Int!

  """현재 페이지 크루즈 목록"""
  items: [Cruise!]!
}

"""
고객 목록 페이지네이션 결과
"""
type CustomerConnection {
  """전체 고객 수"""
  total: Int!

  """현재 페이지 고객 목록"""
  items: [Customer!]!
}

"""
예약 목록 페이지네이션 결과
"""
type BookingConnection {
  """전체 예약 수"""
  total: Int!

  """현재 페이지 예약 목록"""
  items: [Booking!]!
}

# ── Mutation Payloads ─────────────────────────────────────────────────────────

"""
고객 생성/수정 Mutation 결과
"""
type CustomerPayload {
  """처리 성공 여부"""
  success: Boolean!

  """결과 메시지"""
  message: String!

  """생성/수정된 고객 객체 (성공 시 반환)"""
  customer: Customer
}

"""
예약 생성/수정 Mutation 결과
"""
type BookingPayload {
  """처리 성공 여부"""
  success: Boolean!

  """결과 메시지"""
  message: String!

  """생성/수정된 예약 객체 (성공 시 반환)"""
  booking: Booking
}

"""
삭제 Mutation 공통 결과
"""
type DeletePayload {
  """삭제 성공 여부"""
  success: Boolean!

  """결과 메시지"""
  message: String!

  """삭제된 항목의 ID"""
  deletedId: ID!
}

# ── Input Types ───────────────────────────────────────────────────────────────

"""
크루즈 목록 필터 입력
모든 필드는 선택 사항이며, 복수 조건 지정 시 AND로 결합됩니다.
"""
input CruiseFilterInput {
  """출발일 이후 (YYYY-MM-DD, 이상)"""
  startDateFrom: Date

  """출발일 이전 (YYYY-MM-DD, 이하)"""
  startDateTo: Date

  """출발항 (부분 일치 검색)"""
  startPort: String

  """최대 항해 일수 (이하)"""
  maxNumDays: Int

  """최소 항해 일수 (이상)"""
  minNumDays: Int
}

"""
고객 목록 필터 입력
"""
input CustomerFilterInput {
  """국가 코드 (정확히 일치, 예: USA, KOR)"""
  country: String

  """이름 검색 (firstName 또는 lastName 부분 일치)"""
  nameSearch: String
}

"""
예약 목록 필터 입력
"""
input BookingFilterInput {
  """특정 크루즈 ID"""
  cruiseID: ID

  """특정 고객 이메일"""
  customerID: EmailAddress

  """예약 상태 필터"""
  status: BookingStatus
}

"""
페이지네이션 입력
"""
input PaginationInput {
  """건너뛸 항목 수 (기본값: 0)"""
  offset: Int = 0

  """가져올 항목 수 (기본값: 20, 최대: 100)"""
  limit: Int = 20
}

"""
고객 주소 입력
"""
input AddressInput {
  """도로명 주소"""
  street: String!

  """도시"""
  city: String!

  """주/도"""
  state: String

  """우편번호"""
  postalCode: String!

  """국가 코드 (ISO 3166-1 alpha-3)"""
  country: String!
}

"""
고객 생성 입력
모든 필드가 필수입니다.
"""
input CreateCustomerInput {
  """이메일 주소 (고객 고유 ID로 사용됨)"""
  emailAddress: EmailAddress!

  """이름"""
  firstName: String!

  """성"""
  lastName: String!

  """연락처 전화번호"""
  phone: String!

  """거주 주소"""
  address: AddressInput!
}

"""
고객 수정 입력
이메일 주소를 제외한 모든 필드를 수정할 수 있습니다.
"""
input UpdateCustomerInput {
  """이름"""
  firstName: String

  """성"""
  lastName: String

  """연락처 전화번호"""
  phone: String

  """거주 주소"""
  address: AddressInput
}

"""
예약 생성 입력
"""
input CreateBookingInput {
  """예약할 크루즈 ID"""
  cruiseID: ID!

  """예약 고객 이메일 (고객이 사전 등록되어 있어야 함)"""
  customerID: EmailAddress!

  """예약 객실 정보"""
  room: BookedRoomInput!

  """탑승 인원"""
  numPassengers: Int!
}

"""
예약 수정 입력
"""
input UpdateBookingInput {
  """예약 상태 변경"""
  status: BookingStatus

  """객실 변경"""
  room: BookedRoomInput

  """탑승 인원 변경"""
  numPassengers: Int
}

"""
예약 객실 입력
"""
input BookedRoomInput {
  """객실 유형 코드"""
  roomID: RoomTypeCode!

  """예약 객실 수 (최소 1)"""
  numRooms: Int!
}

# ── Root Types ─────────────────────────────────────────────────────────────────

"""
# Query — 데이터 조회

모든 Query는 읽기 전용이며 데이터를 변경하지 않습니다.

## 연관 데이터 자동 로딩
GraphQL의 장점을 활용하여 하나의 쿼리로 연관 데이터를 모두 가져올 수 있습니다:
```graphql
query {
  booking(bookingID: "1001") {
    cruise { title startDate }      # 크루즈 정보 자동 join
    customer { firstName lastName } # 고객 정보 자동 join
    room { details { pricePerNight } }
  }
}
```
"""
type Query {
  # ── Cruise Queries ────────────────────────────────────────────────────────

  """
  전체 크루즈 목록을 조회합니다.
  필터 및 페이지네이션을 지원합니다.

  **예시:**
  ```graphql
  query {
    cruises(filter: { startPort: "Barcelona", maxNumDays: 14 }) {
      total
      items { cruiseID title startDate numDays }
    }
  }
  ```
  """
  cruises(
    """크루즈 목록 필터 조건"""
    filter: CruiseFilterInput

    """페이지네이션"""
    pagination: PaginationInput
  ): CruiseConnection!

  """
  특정 크루즈를 ID로 조회합니다.
  존재하지 않으면 null을 반환합니다.

  **예시:**
  ```graphql
  query {
    cruise(cruiseID: "CRUISE-001") {
      title
      roomTypes { name pricePerNight }
      bookingCount
    }
  }
  ```
  """
  cruise(
    """조회할 크루즈 ID"""
    cruiseID: ID!
  ): Cruise

  # ── Customer Queries ──────────────────────────────────────────────────────

  """
  전체 고객 목록을 조회합니다.
  필터 및 페이지네이션을 지원합니다.

  **예시:**
  ```graphql
  query {
    customers(filter: { country: "USA" }) {
      total
      items { emailAddress fullName bookingCount }
    }
  }
  ```
  """
  customers(
    """고객 목록 필터 조건"""
    filter: CustomerFilterInput

    """페이지네이션"""
    pagination: PaginationInput
  ): CustomerConnection!

  """
  특정 고객을 이메일 주소로 조회합니다.
  존재하지 않으면 null을 반환합니다.

  **예시:**
  ```graphql
  query {
    customer(emailAddress: "alice@tours.com") {
      fullName
      bookings {
        bookingID
        cruise { title startDate }
        status
      }
    }
  }
  ```
  """
  customer(
    """조회할 고객 이메일 주소"""
    emailAddress: EmailAddress!
  ): Customer

  # ── Booking Queries ───────────────────────────────────────────────────────

  """
  전체 예약 목록을 조회합니다.
  크루즈, 고객, 상태로 필터링할 수 있습니다.

  **예시:**
  ```graphql
  query {
    bookings(filter: { status: CONFIRMED }) {
      total
      items {
        bookingID
        cruise { title }
        customer { fullName }
        room { roomID numRooms }
      }
    }
  }
  ```
  """
  bookings(
    """예약 목록 필터 조건"""
    filter: BookingFilterInput

    """페이지네이션"""
    pagination: PaginationInput
  ): BookingConnection!

  """
  특정 예약을 ID로 조회합니다.
  존재하지 않으면 null을 반환합니다.

  **예시:**
  ```graphql
  query {
    booking(bookingID: "1001") {
      status
      cruise { title startDate endDate }
      customer { fullName phone }
      room { roomID details { name pricePerNight } }
      numPassengers
      bookedAt
    }
  }
  ```
  """
  booking(
    """조회할 예약 ID"""
    bookingID: ID!
  ): Booking

  # ── Product Queries ───────────────────────────────────────────────────────

  """
  전체 Product 목록을 조회합니다.
  상태, 공개 범위, 카테고리, 이름 검색 필터 및 페이지네이션을 지원합니다.

  **예시:**
  ```graphql
  query {
    products(filter: { status: PUBLISHED, visibility: PUBLIC }) {
      total
      items { productID name title planCount }
    }
  }
  ```
  """
  products(
    """Product 목록 필터 조건"""
    filter: ProductFilterInput

    """페이지네이션"""
    pagination: PaginationInput
  ): ProductConnection!

  """
  특정 Product를 ID로 조회합니다.

  **예시:**
  ```graphql
  query {
    product(productID: "PROD-001") {
      productID
      title
      status
      plans { planID title rateLimit { count unit } }
    }
  }
  ```
  """
  product(
    """조회할 Product ID"""
    productID: ID!
  ): Product

  # ── Plan Queries ──────────────────────────────────────────────────────────

  """
  전체 Plan 목록을 조회합니다.
  특정 Product, 상태, 무료 여부로 필터링할 수 있습니다.

  **예시:**
  ```graphql
  query {
    plans(filter: { productID: "PROD-001", status: PUBLISHED }) {
      total
      items { planID name title price { amount currency } }
    }
  }
  ```
  """
  plans(
    """Plan 목록 필터 조건"""
    filter: PlanFilterInput

    """페이지네이션"""
    pagination: PaginationInput
  ): PlanConnection!

  """
  특정 Plan을 ID로 조회합니다.

  **예시:**
  ```graphql
  query {
    plan(planID: "PLAN-001") {
      planID
      title
      rateLimit { count interval unit }
      price { amount currency billingPeriod }
      product { productID title }
    }
  }
  ```
  """
  plan(
    """조회할 Plan ID"""
    planID: ID!
  ): Plan
}

"""
# Mutation — 데이터 변경

Mutation은 데이터를 생성, 수정, 삭제합니다.
모든 Mutation은 성공 여부와 메시지를 포함하는 Payload 타입을 반환합니다.

## 에러 처리
- 존재하지 않는 리소스 참조 → 에러 반환 (success: false)
- 중복 데이터 생성 시도 → 에러 반환 (success: false)
- 유효하지 않은 입력 → GraphQL 유효성 검사 에러
"""
type Mutation {
  # ── Customer Mutations ────────────────────────────────────────────────────

  """
  새 고객을 등록합니다.
  같은 이메일 주소의 고객이 이미 존재하면 에러를 반환합니다.

  **예시:**
  ```graphql
  mutation {
    createCustomer(input: {
      emailAddress: "dave@tours.com"
      firstName: "Dave"
      lastName: "Brown"
      phone: "+1-555-0104"
      address: {
        street: "321 Sunset Blvd"
        city: "Los Angeles"
        state: "CA"
        postalCode: "90001"
        country: "USA"
      }
    }) {
      success
      message
      customer { emailAddress fullName createdAt }
    }
  }
  ```
  """
  createCustomer(
    """고객 생성 입력 데이터"""
    input: CreateCustomerInput!
  ): CustomerPayload!

  """
  기존 고객 정보를 수정합니다.
  수정할 필드만 입력하면 됩니다 (나머지 필드 유지).

  **예시:**
  ```graphql
  mutation {
    updateCustomer(
      emailAddress: "alice@tours.com"
      input: { phone: "+1-555-9999" }
    ) {
      success
      customer { emailAddress phone }
    }
  }
  ```
  """
  updateCustomer(
    """수정할 고객 이메일 주소"""
    emailAddress: EmailAddress!

    """수정할 필드"""
    input: UpdateCustomerInput!
  ): CustomerPayload!

  """
  고객을 삭제합니다.
  활성 예약(CONFIRMED/PENDING 상태)이 있으면 삭제할 수 없습니다.

  **예시:**
  ```graphql
  mutation {
    deleteCustomer(emailAddress: "dave@tours.com") {
      success
      message
      deletedId
    }
  }
  ```
  """
  deleteCustomer(
    """삭제할 고객 이메일 주소"""
    emailAddress: EmailAddress!
  ): DeletePayload!

  # ── Booking Mutations ─────────────────────────────────────────────────────

  """
  새 예약을 생성합니다.
  지정한 cruiseID와 customerID가 실제로 존재하는지 검증합니다.
  크루즈의 roomTypes에 해당 roomID가 있는지도 확인합니다.

  **예시:**
  ```graphql
  mutation {
    createBooking(input: {
      cruiseID: "CRUISE-002"
      customerID: "carol@tours.com"
      room: { roomID: BAL, numRooms: 1 }
      numPassengers: 2
    }) {
      success
      message
      booking {
        bookingID
        status
        cruise { title startDate }
        room { roomID details { pricePerNight } }
      }
    }
  }
  ```
  """
  createBooking(
    """예약 생성 입력 데이터"""
    input: CreateBookingInput!
  ): BookingPayload!

  """
  기존 예약을 수정합니다.
  CANCELLED 또는 COMPLETED 상태의 예약은 수정할 수 없습니다.

  **예시:**
  ```graphql
  mutation {
    updateBooking(
      bookingID: "1001"
      input: { numPassengers: 3 }
    ) {
      success
      booking { bookingID numPassengers updatedAt }
    }
  }
  ```
  """
  updateBooking(
    """수정할 예약 ID"""
    bookingID: ID!

    """수정할 필드"""
    input: UpdateBookingInput!
  ): BookingPayload!

  """
  예약을 취소(삭제)합니다.
  COMPLETED 상태의 예약은 삭제할 수 없습니다.

  **예시:**
  ```graphql
  mutation {
    deleteBooking(bookingID: "1001") {
      success
      message
      deletedId
    }
  }
  ```
  """
  deleteBooking(
    """삭제할 예약 ID"""
    bookingID: ID!
  ): DeletePayload!

  # ── Product Mutations ─────────────────────────────────────────────────────

  """
  새 Product를 생성합니다. 초안(DRAFT) 상태로 생성됩니다.
  같은 name의 Product가 이미 존재하면 에러를 반환합니다.

  **예시:**
  ```graphql
  mutation {
    createProduct(input: {
      name: "odata-product"
      title: "OData Catalog Product"
      description: "제품 카탈로그 OData API 상품"
      visibility: PUBLIC
      categories: ["catalog", "odata"]
    }) {
      success
      message
      product { productID name status }
    }
  }
  ```
  """
  createProduct(
    """Product 생성 입력 데이터"""
    input: CreateProductInput!
  ): ProductPayload!

  """
  기존 Product를 수정합니다. DRAFT 또는 REJECTED 상태에서만 수정 가능합니다.

  **예시:**
  ```graphql
  mutation {
    updateProduct(productID: "PROD-004" input: { title: "Updated Title" }) {
      success
      product { productID title updatedAt }
    }
  }
  ```
  """
  updateProduct(
    """수정할 Product ID"""
    productID: ID!

    """수정할 필드"""
    input: UpdateProductInput!
  ): ProductPayload!

  """
  Product를 검토 요청(REVIEW) 상태로 제출합니다.
  DRAFT 상태에서만 요청 가능합니다.

  **예시:**
  ```graphql
  mutation {
    submitProductForReview(productID: "PROD-003" note: "초기 기업 플랜 검토 요청") {
      success
      product { productID status reviewNote }
    }
  }
  ```
  """
  submitProductForReview(
    """검토 요청할 Product ID"""
    productID: ID!

    """검토 담당자에게 전달할 메모 (선택)"""
    note: String
  ): ProductPayload!

  """
  Product를 게시(PUBLISHED) 상태로 배포합니다.
  REVIEW 상태에서만 배포 가능합니다.

  **예시:**
  ```graphql
  mutation {
    publishProduct(productID: "PROD-003") {
      success
      product { productID status publishedAt }
    }
  }
  ```
  """
  publishProduct(
    """배포할 Product ID"""
    productID: ID!
  ): ProductPayload!

  """
  Product를 거절(REJECTED) 상태로 전환합니다.
  REVIEW 상태에서만 거절 가능합니다.

  **예시:**
  ```graphql
  mutation {
    rejectProduct(productID: "PROD-003" reason: "Rate Limit 정책 재검토 필요") {
      success
      product { productID status rejectionReason }
    }
  }
  ```
  """
  rejectProduct(
    """거절할 Product ID"""
    productID: ID!

    """거절 사유"""
    reason: String!
  ): ProductPayload!

  """
  Product를 사용 중단(DEPRECATED) 상태로 전환합니다.
  PUBLISHED 상태에서만 가능합니다.

  **예시:**
  ```graphql
  mutation {
    deprecateProduct(productID: "PROD-001") {
      success
      product { productID status }
    }
  }
  ```
  """
  deprecateProduct(
    """사용 중단할 Product ID"""
    productID: ID!
  ): ProductPayload!

  """
  Product를 삭제합니다.
  DRAFT 또는 REJECTED 상태에서만 삭제 가능합니다. (PUBLISHED 보호)

  **예시:**
  ```graphql
  mutation {
    deleteProduct(productID: "PROD-004") {
      success
      message
      deletedId
    }
  }
  ```
  """
  deleteProduct(
    """삭제할 Product ID"""
    productID: ID!
  ): DeletePayload!

  # ── Plan Mutations ────────────────────────────────────────────────────────

  """
  새 Plan을 생성합니다. 초안(DRAFT) 상태로 생성됩니다.
  지정한 productID의 Product가 존재해야 합니다.
  같은 Product 내에 동일한 name의 Plan이 있으면 에러를 반환합니다.

  **예시:**
  ```graphql
  mutation {
    createPlan(input: {
      productID: "PROD-001"
      name: "premium"
      title: "프리미엄 플랜"
      description: "무제한 호출, 전용 SLA"
      rateLimit: { count: 10000, interval: 1, unit: HOUR }
      price: { amount: 99000, currency: "KRW", billingPeriod: "monthly" }
      features: ["전체 API", "우선 지원"]
      approvalRequired: false
    }) {
      success
      plan { planID name status }
    }
  }
  ```
  """
  createPlan(
    """Plan 생성 입력 데이터"""
    input: CreatePlanInput!
  ): PlanPayload!

  """
  기존 Plan을 수정합니다. DRAFT 또는 REJECTED 상태에서만 수정 가능합니다.

  **예시:**
  ```graphql
  mutation {
    updatePlan(planID: "PLAN-005" input: { title: "수정된 플랜 이름" }) {
      success
      plan { planID title updatedAt }
    }
  }
  ```
  """
  updatePlan(
    """수정할 Plan ID"""
    planID: ID!

    """수정할 필드"""
    input: UpdatePlanInput!
  ): PlanPayload!

  """
  Plan을 검토 요청(REVIEW) 상태로 제출합니다.
  DRAFT 상태에서만 요청 가능합니다.

  **예시:**
  ```graphql
  mutation {
    submitPlanForReview(planID: "PLAN-005") {
      success
      plan { planID status }
    }
  }
  ```
  """
  submitPlanForReview(
    """검토 요청할 Plan ID"""
    planID: ID!
  ): PlanPayload!

  """
  Plan을 게시(PUBLISHED) 상태로 배포합니다.
  REVIEW 상태에서만 배포 가능합니다.
  연결된 Product가 PUBLISHED 상태가 아니어도 독립적으로 배포할 수 있습니다.

  **예시:**
  ```graphql
  mutation {
    publishPlan(planID: "PLAN-005") {
      success
      plan { planID status }
    }
  }
  ```
  """
  publishPlan(
    """배포할 Plan ID"""
    planID: ID!
  ): PlanPayload!

  """
  Plan을 거절(REJECTED) 상태로 전환합니다.
  REVIEW 상태에서만 거절 가능합니다.

  **예시:**
  ```graphql
  mutation {
    rejectPlan(planID: "PLAN-005" reason: "Rate Limit 수치 재검토 필요") {
      success
      plan { planID status }
    }
  }
  ```
  """
  rejectPlan(
    """거절할 Plan ID"""
    planID: ID!

    """거절 사유"""
    reason: String!
  ): PlanPayload!

  """
  Plan을 사용 중단(DEPRECATED) 상태로 전환합니다.

  **예시:**
  ```graphql
  mutation {
    deprecatePlan(planID: "PLAN-001") {
      success
      plan { planID status }
    }
  }
  ```
  """
  deprecatePlan(
    """사용 중단할 Plan ID"""
    planID: ID!
  ): PlanPayload!

  """
  Plan을 삭제합니다.
  DRAFT 또는 REJECTED 상태에서만 삭제 가능합니다.

  **예시:**
  ```graphql
  mutation {
    deletePlan(planID: "PLAN-005") {
      success
      message
      deletedId
    }
  }
  ```
  """
  deletePlan(
    """삭제할 Plan ID"""
    planID: ID!
  ): DeletePayload!
}

"""
# Subscription — 실시간 이벤트

WebSocket을 통해 예약 변경 이벤트를 실시간으로 구독합니다.
IBM API Connect의 AsyncAPI/WebSocket 지원과 연동 가능합니다.

> **참고**: 이 서버는 in-memory PubSub으로 구현되어 있습니다.
> 프로덕션 환경에서는 Redis PubSub 또는 Apache Kafka 연동을 권장합니다.
"""
type Subscription {
  """
  예약 생성/수정/취소 이벤트를 실시간으로 수신합니다.

  **예시:**
  ```graphql
  subscription {
    bookingUpdated {
      bookingID
      status
      cruise { title }
      customer { fullName }
    }
  }
  ```
  """
  bookingUpdated: Booking!

  """
  특정 크루즈의 예약 이벤트만 구독합니다.

  **예시:**
  ```graphql
  subscription {
    cruiseBookingUpdated(cruiseID: "CRUISE-001") {
      bookingID
      status
      customer { fullName }
    }
  }
  ```
  """
  cruiseBookingUpdated(
    """구독할 크루즈 ID"""
    cruiseID: ID!
  ): Booking!
}

# ═══════════════════════════════════════════════════════════════════════════════
# Product & Plan 카탈로그 관리 도메인
# ═══════════════════════════════════════════════════════════════════════════════
#
# 도메인 모델:
#   Product (API 상품)  --> Plan[]  (1:N)
#   Plan    (사용 정책) --> Product (N:1)
#
# 상태 흐름:
#   Product/Plan:  draft → review → published → deprecated
#                  review → rejected → draft (재제출)
#
# IBM API Connect 개념 매핑:
#   Product   ↔ APIC Product (하나 이상의 API를 묶는 단위)
#   Plan      ↔ APIC Plan    (Rate Limit·가격 정책·기능 범위 정의)

# ── Product / Plan Enums ───────────────────────────────────────────────────────

"""
Product/Plan 상태.
생성 시 draft에서 시작하여 단계별로 전이합니다.
"""
enum CatalogStatus {
  """초안 — 작성 중이며 아직 검토 요청 전"""
  DRAFT

  """검토 중 — 관리자에 의한 검토 진행 중"""
  REVIEW

  """게시됨 — 구독자에게 공개"""
  PUBLISHED

  """거절됨 — 검토에서 거절; draft로 재제출 가능"""
  REJECTED

  """사용 중단됨 — 신규 구독 불가, 기존 구독은 유지"""
  DEPRECATED
}

"""
Product 공개 범위
"""
enum ProductVisibility {
  """공개 — 모든 사용자에게 노출"""
  PUBLIC

  """인증 사용자 전용 — 로그인한 사용자만 노출"""
  AUTHENTICATED

  """특정 사용자/조직만 — visibility list로 제어"""
  CUSTOM
}

"""
Rate Limit 시간 단위
"""
enum RateLimitUnit {
  """초"""
  SECOND

  """분"""
  MINUTE

  """시간"""
  HOUR

  """일"""
  DAY
}

# ── Product / Plan Types ───────────────────────────────────────────────────────

"""
Rate Limit 정책 — 단위 시간당 최대 호출 횟수
"""
type RateLimitPolicy {
  """최대 호출 횟수"""
  count: Int!

  """시간 단위 값 (예: 1)"""
  interval: Int!

  """시간 단위 (SECOND | MINUTE | HOUR | DAY)"""
  unit: RateLimitUnit!
}

"""
가격 정보
"""
type PlanPrice {
  """요금 (0이면 무료)"""
  amount: Float!

  """통화 코드 (ISO 4217, 예: KRW, USD)"""
  currency: String!

  """청구 주기 (monthly | yearly | null=무료)"""
  billingPeriod: String
}

"""
Product — IBM API Connect에서 하나 이상의 API를 묶어 배포하는 상품 단위.
Plan을 통해 다양한 가격·제한 정책을 제공합니다.
"""
type Product {
  """Product 고유 ID (예: PROD-001)"""
  productID: ID!

  """Product 이름 (URL-safe, 영문 소문자·하이픈)"""
  name: String!

  """Product 표시 이름"""
  title: String!

  """Product 설명"""
  description: String!

  """Product 버전 (SemVer, 예: 1.0.0)"""
  version: String!

  """배포 상태"""
  status: CatalogStatus!

  """공개 범위"""
  visibility: ProductVisibility!

  """카테고리 태그 목록"""
  categories: [String!]!

  """이 Product에 연결된 모든 Plan 목록"""
  plans: [Plan!]!

  """연결된 Plan 수"""
  planCount: Int!

  """생성 일시"""
  createdAt: DateTime!

  """마지막 수정 일시"""
  updatedAt: DateTime!

  """게시 일시 (status=PUBLISHED 일 때만 존재)"""
  publishedAt: DateTime

  """검토 요청 메모"""
  reviewNote: String

  """거절 사유 (status=REJECTED 일 때만 존재)"""
  rejectionReason: String
}

"""
Plan — Product에 연결되는 사용 정책.
요금, Rate Limit, 허용 기능 범위를 정의합니다.
"""
type Plan {
  """Plan 고유 ID (예: PLAN-001)"""
  planID: ID!

  """연결된 Product ID"""
  productID: ID!

  """이 Plan이 속한 Product (자동 조인)"""
  product: Product!

  """Plan 이름 (URL-safe, 영문 소문자·하이픈)"""
  name: String!

  """Plan 표시 이름"""
  title: String!

  """Plan 설명"""
  description: String!

  """Rate Limit 정책"""
  rateLimit: RateLimitPolicy!

  """Burst Limit (피크 허용, null이면 미적용)"""
  burstLimit: RateLimitPolicy

  """가격 정보"""
  price: PlanPrice!

  """이 Plan에서 허용하는 기능/API 목록"""
  features: [String!]!

  """배포 상태"""
  status: CatalogStatus!

  """구독 시 관리자 승인 필요 여부"""
  approvalRequired: Boolean!

  """생성 일시"""
  createdAt: DateTime!

  """마지막 수정 일시"""
  updatedAt: DateTime!
}

# ── Catalog Connection Types ───────────────────────────────────────────────────

"""
Product 목록 페이지네이션 결과
"""
type ProductConnection {
  """전체 Product 수"""
  total: Int!

  """현재 페이지 Product 목록"""
  items: [Product!]!
}

"""
Plan 목록 페이지네이션 결과
"""
type PlanConnection {
  """전체 Plan 수"""
  total: Int!

  """현재 페이지 Plan 목록"""
  items: [Plan!]!
}

# ── Catalog Mutation Payloads ─────────────────────────────────────────────────

"""
Product 생성/수정/배포 Mutation 결과
"""
type ProductPayload {
  """처리 성공 여부"""
  success: Boolean!

  """결과 메시지"""
  message: String!

  """처리된 Product (성공 시 반환)"""
  product: Product
}

"""
Plan 생성/수정/배포 Mutation 결과
"""
type PlanPayload {
  """처리 성공 여부"""
  success: Boolean!

  """결과 메시지"""
  message: String!

  """처리된 Plan (성공 시 반환)"""
  plan: Plan
}

# ── Catalog Input Types ────────────────────────────────────────────────────────

"""
Product 목록 필터 입력
"""
input ProductFilterInput {
  """배포 상태 필터"""
  status: CatalogStatus

  """공개 범위 필터"""
  visibility: ProductVisibility

  """카테고리 필터 (부분 일치)"""
  category: String

  """이름/제목 검색 (부분 일치)"""
  nameSearch: String
}

"""
Plan 목록 필터 입력
"""
input PlanFilterInput {
  """특정 Product ID"""
  productID: ID

  """배포 상태 필터"""
  status: CatalogStatus

  """무료 플랜만 조회"""
  freeOnly: Boolean
}

"""
Rate Limit 정책 입력
"""
input RateLimitPolicyInput {
  """최대 호출 횟수"""
  count: Int!

  """시간 단위 값"""
  interval: Int!

  """시간 단위"""
  unit: RateLimitUnit!
}

"""
가격 입력
"""
input PlanPriceInput {
  """요금"""
  amount: Float!

  """통화 코드"""
  currency: String!

  """청구 주기 (monthly | yearly | null)"""
  billingPeriod: String
}

"""
Product 생성 입력
"""
input CreateProductInput {
  """Product 이름 (URL-safe)"""
  name: String!

  """Product 표시 이름"""
  title: String!

  """Product 설명"""
  description: String!

  """버전 (기본값: 1.0.0)"""
  version: String

  """공개 범위 (기본값: PUBLIC)"""
  visibility: ProductVisibility

  """카테고리 태그 목록"""
  categories: [String!]
}

"""
Product 수정 입력 (지정한 필드만 수정)
"""
input UpdateProductInput {
  """Product 표시 이름"""
  title: String

  """Product 설명"""
  description: String

  """버전"""
  version: String

  """공개 범위"""
  visibility: ProductVisibility

  """카테고리 태그 목록"""
  categories: [String!]
}

"""
Plan 생성 입력
"""
input CreatePlanInput {
  """연결할 Product ID"""
  productID: ID!

  """Plan 이름 (URL-safe)"""
  name: String!

  """Plan 표시 이름"""
  title: String!

  """Plan 설명"""
  description: String!

  """Rate Limit 정책"""
  rateLimit: RateLimitPolicyInput!

  """Burst Limit (선택)"""
