# ─────────────────────────────────────────────────────────────────────────────
# Components
# ─────────────────────────────────────────────────────────────────────────────
components:

  # ── Schemas ──────────────────────────────────────────────────────────────────
  schemas:

    Book:
      type: object
      description: 도서 정보
      required:
        - id
        - title
        - author
        - isbn
        - genre
        - available
        - stock
      properties:
        id:
          type: string
          description: 도서 고유 ID (서버 자동 생성)
          example: b001
          readOnly: true
        title:
          type: string
          description: 도서 제목
          minLength: 1
          maxLength: 500
          example: Clean Code
        author:
          type: string
          description: 저자 (복수 저자는 쉼표로 구분)
          minLength: 1
          maxLength: 300
          example: Robert C. Martin
        isbn:
          type: string
          description: ISBN-13 형식 (하이픈 포함)
          pattern: '^978-[0-9\-]{10,13}$'
          example: "978-0132350884"
        genre:
          type: string
          description: 장르 (미입력 시 Uncategorized)
          example: Technology
          default: Uncategorized
        publishedYear:
          type: integer
          description: 출판 연도
          minimum: 1000
          maximum: 2100
          nullable: true
          example: 2008
        available:
          type: boolean
          description: 대출 가능 여부 (stock > 0 이면 true)
          example: true
          readOnly: true
        stock:
          type: integer
          description: 현재 대출 가능 재고 수량
          minimum: 0
          example: 3

    BookCreateRequest:
      type: object
      description: 도서 등록 요청
      required:
        - title
        - author
        - isbn
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: "Refactoring: Improving the Design of Existing Code"
        author:
          type: string
          minLength: 1
          maxLength: 300
          example: Martin Fowler
        isbn:
          type: string
          pattern: '^978-[0-9\-]{10,13}$'
          example: "978-0134757599"
        genre:
          type: string
          maxLength: 100
          default: Uncategorized
          example: Technology
        publishedYear:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
          example: 2018
        stock:
          type: integer
          minimum: 0
          default: 1
          example: 3

    BookUpdateRequest:
      type: object
      description: 도서 전체 수정 요청 (PUT)
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: "Clean Code (개정판)"
        author:
          type: string
          minLength: 1
          maxLength: 300
          example: Robert C. Martin
        isbn:
          type: string
          pattern: '^978-[0-9\-]{10,13}$'
          example: "978-0132350884"
        genre:
          type: string
          maxLength: 100
          example: Technology
        publishedYear:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
          example: 2008
        available:
          type: boolean
          example: true
        stock:
          type: integer
          minimum: 0
          example: 5

    BookPatchRequest:
      type: object
      description: |
        도서 부분 수정 요청 (PATCH). 수정할 필드만 포함합니다.
        `stock` 변경 시 `available` 이 자동으로 동기화됩니다.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
          example: "Clean Code (개정판)"
        author:
          type: string
          minLength: 1
          maxLength: 300
        isbn:
          type: string
          pattern: '^978-[0-9\-]{10,13}$'
        genre:
          type: string
          maxLength: 100
          example: "Classic Fiction"
        publishedYear:
          type: integer
          minimum: 1000
          maximum: 2100
          nullable: true
        available:
          type: boolean
        stock:
          type: integer
          minimum: 0
          example: 5

    BookDeleteResponse:
      type: object
      required:
        - message
        - book
      properties:
        message:
          type: string
          example: Book deleted successfully
        book:
          $ref: "#/components/schemas/Book"

    BookListResponse:
      type: object
      description: 페이징을 포함한 도서 목록
      required:
        - total
        - page
        - limit
        - totalPages
        - data
      properties:
        total:
          type: integer
          description: 필터 조건에 맞는 전체 도서 수
          example: 5
        page:
          type: integer
          description: 현재 페이지 번호
          minimum: 1
          example: 1
        limit:
          type: integer
          description: 페이지당 결과 수
          minimum: 1
          maximum: 100
          example: 10
        totalPages:
          type: integer
          description: 전체 페이지 수
          example: 1
        data:
          type: array
          items:
            $ref: "#/components/schemas/Book"

    Loan:
      type: object
      description: 대출 기록
      required:
        - id
        - bookId
        - borrowerName
        - borrowerEmail
        - loanDate
        - dueDate
        - status
      properties:
        id:
          type: string
          description: 대출 고유 ID (서버 자동 생성)
          example: l001
          readOnly: true
        bookId:
          type: string
          description: 대출한 도서의 ID
          example: b003
        borrowerName:
          type: string
          description: 대출자 이름
          minLength: 1
          maxLength: 100
          example: Alice Kim
        borrowerEmail:
          type: string
          format: email
          description: 대출자 이메일
          example: alice@example.com
        loanDate:
          type: string
          format: date
          description: 대출일 (YYYY-MM-DD)
          example: "2024-11-01"
          readOnly: true
        dueDate:
          type: string
          format: date
          description: 반납 예정일 (YYYY-MM-DD, 대출일 + daysToLoan)
          example: "2024-11-15"
          readOnly: true
        returnDate:
          type: string
          format: date
          description: 실제 반납일 (반납 전은 null)
          nullable: true
          example: null
        status:
          type: string
          description: 대출 상태
          enum:
            - active
            - returned
          example: active

    LoanCreateRequest:
      type: object
      description: 도서 대출 신청 요청
      required:
        - bookId
        - borrowerName
        - borrowerEmail
      properties:
        bookId:
          type: string
          description: 대출할 도서의 ID
          example: b001
        borrowerName:
          type: string
          minLength: 1
          maxLength: 100
          description: 대출자 이름
          example: 홍길동
        borrowerEmail:
          type: string
          format: email
          description: 대출자 이메일
          example: hong@example.com
        daysToLoan:
          type: integer
          description: 대출 기간 (일)
          minimum: 1
          maximum: 90
          default: 14
          example: 14

    LoanCreateResponse:
      type: object
      description: 대출 신청 성공 응답 (생성된 대출 정보 + 변경된 도서 재고 정보 포함)
      required:
        - loan
        - book
      properties:
        loan:
          $ref: "#/components/schemas/Loan"
        book:
          type: object
          description: 대출 후 갱신된 도서 재고 정보
          required:
            - id
            - title
            - available
            - stock
          properties:
            id:
              type: string
              example: b001
            title:
              type: string
              example: Clean Code
            available:
              type: boolean
              example: true
            stock:
              type: integer
              example: 2

    LoanListResponse:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          description: 조건에 맞는 전체 대출 건수
          example: 1
        data:
          type: array
          items:
            $ref: "#/components/schemas/Loan"

    LoanReturnResponse:
      type: object
      required:
        - message
        - loan
      properties:
        message:
          type: string
          example: Book returned successfully
        loan:
          $ref: "#/components/schemas/Loan"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum: [ok]
          example: ok
        timestamp:
          type: string
          format: date-time
          example: "2024-11-15T09:00:00.000Z"

    ApiInfo:
      type: object
      properties:
        name:
          type: string
          example: Library Management API
        version:
          type: string
          example: "1.0.0"
        description:
          type: string
        endpoints:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string

    ErrorMessage:
      type: object
      description: 단순 에러 메시지
      required:
        - error
      properties:
        error:
          type: string
          description: 에러 내용
          example: Book not found

    ErrorIdMessage:
      type: object
      description: 에러 메시지 + ID
      required:
        - error
        - id
      properties:
        error:
          type: string
          example: Book not found
        id:
          type: string
          example: b999

    ErrorIsbnConflict:
      type: object
      required:
        - error
        - isbn
      properties:
        error:
          type: string
          example: A book with this ISBN already exists
        isbn:
          type: string
          example: "978-0134757599"

    ErrorActiveLoans:
      type: object
      required:
        - error
        - activeLoans
      properties:
        error:
          type: string
          example: Cannot delete book with active loans
        activeLoans:
          type: integer
          description: 현재 활성 대출 건수
          example: 1

    ErrorBookUnavailable:
      type: object
      required:
        - error
        - bookId
      properties:
        error:
          type: string
          example: Book is not available for loan
        bookId:
          type: string
          example: b003

  # ── Product / Plan Schemas ───────────────────────────────────────────────────

    # ── Product 스키마 ──────────────────────────────────────────────────────────
    RateLimitPolicy:
      type: object
      description: Rate Limit 정책
      required: [count, interval, unit]
      properties:
        count:    { type: integer, minimum: 1, description: 최대 호출 횟수 }
        interval: { type: integer, minimum: 1, description: 시간 단위 값 }
        unit:
          type: string
          enum: [second, minute, hour, day]
          description: 시간 단위

    PlanPrice:
      type: object
      description: Plan 가격 정보
      required: [amount, currency]
      properties:
        amount:
          type: number
          minimum: 0
          description: 요금 (0이면 무료)
        currency:
          type: string
          description: "통화 코드 (KRW, USD 등)"
        billingPeriod:
          type: string
          nullable: true
          description: "청구 주기 (monthly | yearly | null=무료)"

    Product:
      type: object
      description: API 상품(Product) 정보
      properties:
        id:              { type: string, description: "Product 고유 ID (예: PROD-001)" }
        name:            { type: string, description: Product 이름 (URL-safe) }
        title:           { type: string, description: Product 표시 이름 }
        description:     { type: string, description: Product 설명 }
        version:         { type: string, description: "버전 (SemVer)" }
        status:
          type: string
          enum: [draft, review, published, rejected, deprecated]
          description: 배포 상태
        visibility:
          type: string
          enum: [public, authenticated, custom]
          description: 공개 범위
        categories:      { type: array, items: { type: string }, description: 카테고리 태그 목록 }
        createdAt:       { type: string, format: date-time }
        updatedAt:       { type: string, format: date-time }
        publishedAt:     { type: string, format: date-time, nullable: true }
        reviewNote:      { type: string, nullable: true, description: 검토 메모 }
        rejectionReason: { type: string, nullable: true, description: 거절 사유 }

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            plans:      { type: array, items: { $ref: "#/components/schemas/Plan" } }
            planCount:  { type: integer }

    ProductInput:
      type: object
      description: Product 생성/수정 입력
      required: [name, title, description]
      properties:
        name:        { type: string, description: "Product 이름 (URL-safe, 영문 소문자·하이픈)" }
        title:       { type: string, description: Product 표시 이름 }
        description: { type: string, description: Product 설명 }
        version:     { type: string, default: "1.0.0" }
        visibility:
          type: string
          enum: [public, authenticated, custom]
          default: public
        categories:  { type: array, items: { type: string } }

    ProductPatchInput:
      type: object
      description: Product 부분 수정 입력 (하나 이상의 필드 필요)
      properties:
        title:       { type: string }
        description: { type: string }
        version:     { type: string }
        visibility:
          type: string
          enum: [public, authenticated, custom]
        categories:  { type: array, items: { type: string } }

    ProductListResponse:
      type: object
      properties:
        total:      { type: integer }
        page:       { type: integer }
        limit:      { type: integer }
        totalPages: { type: integer }
        data:       { type: array, items: { $ref: "#/components/schemas/Product" } }

    ProductActionResponse:
      type: object
      properties:
        message: { type: string }
        product: { $ref: "#/components/schemas/Product" }

    ProductDeleteResponse:
      type: object
      properties:
        message:          { type: string }
        deletedProduct:   { $ref: "#/components/schemas/Product" }
        deletedPlanCount: { type: integer }

    # ── Plan 스키마 ─────────────────────────────────────────────────────────────
    Plan:
      type: object
      description: 사용 정책(Plan) 정보
      properties:
        id:               { type: string, description: "Plan 고유 ID (예: PLAN-001)" }
        productId:        { type: string, description: 연결된 Product ID }
        name:             { type: string, description: Plan 이름 (URL-safe) }
        title:            { type: string, description: Plan 표시 이름 }
        description:      { type: string, description: Plan 설명 }
        rateLimit:        { $ref: "#/components/schemas/RateLimitPolicy" }
        burstLimit:
          $ref: "#/components/schemas/RateLimitPolicy"
        price:            { $ref: "#/components/schemas/PlanPrice" }
        features:         { type: array, items: { type: string }, description: 허용 기능 목록 }
        status:
          type: string
          enum: [draft, review, published, rejected, deprecated]
        approvalRequired: { type: boolean, description: 구독 시 관리자 승인 필요 여부 }
        createdAt:        { type: string, format: date-time }
        updatedAt:        { type: string, format: date-time }

    PlanDetail:
      allOf:
        - $ref: "#/components/schemas/Plan"
        - type: object
          properties:
            product: { $ref: "#/components/schemas/Product" }

    PlanInput:
      type: object
      description: Plan 생성/수정 입력
      required: [productId, name, title, description, rateLimit, price]
      properties:
        productId:        { type: string, description: 연결할 Product ID }
        name:             { type: string, description: Plan 이름 (URL-safe) }
        title:            { type: string }
        description:      { type: string }
        rateLimit:        { $ref: "#/components/schemas/RateLimitPolicy" }
        burstLimit:
          $ref: "#/components/schemas/RateLimitPolicy"
        price:            { $ref: "#/components/schemas/PlanPrice" }
        features:         { type: array, items: { type: string } }
        approvalRequired: { type: boolean, default: false }

    PlanPatchInput:
      type: object
      description: Plan 부분 수정 입력
      properties:
        title:            { type: string }
        description:      { type: string }
        rateLimit:        { $ref: "#/components/schemas/RateLimitPolicy" }
        burstLimit:
          $ref: "#/components/schemas/RateLimitPolicy"
        price:            { $ref: "#/components/schemas/PlanPrice" }
        features:         { type: array, items: { type: string } }
        approvalRequired: { type: boolean }

    PlanListResponse:
      type: object
      properties:
        total:      { type: integer }
        page:       { type: integer }
        limit:      { type: integer }
        totalPages: { type: integer }
        data:       { type: array, items: { $ref: "#/components/schemas/Plan" } }

    PlanActionResponse:
      type: object
      properties:
        message: { type: string }
        plan:    { $ref: "#/components/schemas/Plan" }

    PlanDeleteResponse:
      type: object
      properties:
        message:     { type: string }
        deletedPlan: { $ref: "#/components/schemas/Plan" }

    ErrorResponse:
      type: object
      properties:
        error:  { type: string, description: 에러 메시지 }
        status: { type: string, nullable: true }
        id:     { type: string, nullable: true }

  # ── Parameters ───────────────────────────────────────────────────────────────
  parameters:

    PathBookId:
      name: bookId
      in: path
      required: true
      description: 도서 고유 ID
      schema:
        type: string
      example: b001

    PathLoanId:
      name: loanId
      in: path
      required: true
      description: 대출 고유 ID
      schema:
        type: string
      example: l001

    QueryGenre:
      name: genre
      in: query
      required: false
      description: 장르로 필터링 (대소문자 무관)
      schema:
        type: string
      examples:
        technology:
          value: Technology
          summary: Technology 장르
        fiction:
          value: Fiction
          summary: Fiction 장르
        history:
          value: History
          summary: History 장르

    QueryAvailable:
      name: available
      in: query
      required: false
      description: 대출 가능 여부로 필터링
      schema:
        type: string
        enum: ["true", "false"]
      example: "true"

    QueryAuthor:
      name: author
      in: query
      required: false
      description: 저자명 부분 검색 (대소문자 무관)
      schema:
        type: string
      example: Martin

    QueryPage:
      name: page
      in: query
      required: false
      description: 페이지 번호 (1부터 시작)
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    QueryLimit:
      name: limit
      in: query
      required: false
      description: 페이지당 결과 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10

    QueryLoanStatus:
      name: status
      in: query
      required: false
      description: 대출 상태로 필터링
      schema:
        type: string
        enum:
          - active
          - returned
      example: active

    QueryLoanBookId:
      name: bookId
      in: query
      required: false
      description: 특정 도서의 대출 기록만 조회
      schema:
        type: string
      example: b003

  # ── Responses ─────────────────────────────────────────────────────────────────
  responses:

    BadRequest:
      description: 잘못된 요청 (필수 필드 누락 또는 유효하지 않은 값)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          examples:
            missingBookFields:
              summary: 도서 등록 필수 필드 누락
              value:
                error: "title, author, isbn are required fields"
            missingLoanFields:
              summary: 대출 신청 필수 필드 누락
              value:
                error: "bookId, borrowerName, borrowerEmail are required"

    BookNotFound:
      description: 도서를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorIdMessage"
          example:
            error: Book not found
            id: b999

    LoanNotFound:
      description: 대출 기록을 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorMessage"
          example:
            error: Loan not found
