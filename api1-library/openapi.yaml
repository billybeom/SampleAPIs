    patch:
      tags: [Products]
      summary: Product 부분 수정
      operationId: updateProduct
      description: Product를 부분 수정합니다. **draft** 또는 **rejected** 상태에서만 가능합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPatchInput" }
      responses:
        "200":
          description: 수정된 Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { description: 수정할 필드 없음, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "404": { description: Product를 찾을 수 없음, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: "수정 불가 상태", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
    delete:
      tags: [Products]
      summary: Product 삭제
