openapi: "3.0.3"

info:
  title: Library Management API
  version: "1.0.0"
  description: |
    도서관 도서 및 대출을 관리하는 REST API입니다.
    IBM API Connect 등록용 샘플로 설계되었으며, 인증 없이 사용 가능한
    직관적인 CRUD 패턴을 시연합니다.

    ## 주요 기능
    - 도서 등록/조회/수정/삭제 (장르·저자·가용여부 필터, 페이징 지원)
    - 도서 대출 신청 및 반납 처리
    - 재고 자동 관리 (대출 시 감소, 반납 시 증가, stock=0 시 available=false 자동 전환)

    ## 데이터 저장
    In-memory 저장소를 사용하며, 서버 재시작 시 초기 데이터로 리셋됩니다.

  contact:
    name: IBM API Connect Sample
    url: https://www.ibm.com/products/api-connect
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버
  - url: https://library-api.apps.your-cluster.example.com
    description: OpenShift 배포 (Route)
  - url: https://library-api.your-cluster.example.com
    description: Kubernetes 배포 (Ingress)

tags:
  - name: Health
    description: 서버 상태 확인
  - name: Books
    description: 도서 관리 (CRUD + 필터/페이징)
  - name: Loans
    description: 도서 대출 및 반납 관리
  - name: Products
    description: API 상품(Product) 관리 및 배포 흐름 (draft → review → published)
  - name: Plans
    description: 사용 정책(Plan) 관리 및 배포 흐름 (draft → review → published)

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────────────────────────────────────
  /:
    get:
      tags: [Health]
      summary: API 정보 및 엔드포인트 목록
      operationId: getApiInfo
      description: API 버전, 설명, 사용 가능한 엔드포인트 목록을 반환합니다.
      responses:
        "200":
          description: API 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
              example:
                name: Library Management API
                version: 1.0.0
                description: Sample REST API for IBM API Connect demonstration
                endpoints:
                  books:
                    GET /books: List all books
                    GET /books/:id: Get a single book by ID
                    POST /books: Add a new book
                    PUT /books/:id: Update a book (full)
                    PATCH /books/:id: Update a book (partial)
                    DELETE /books/:id: Delete a book
                  loans:
                    GET /loans: List all loan records
                    GET /loans/:id: Get a single loan record
                    POST /loans: Borrow a book
                    PATCH /loans/:id/return: Return a borrowed book

  /health:
    get:
      tags: [Health]
      summary: 서버 상태 확인
      operationId: getHealth
      description: 서버가 정상 동작 중인지 확인합니다. 로드밸런서 헬스체크에 사용됩니다.
      responses:
        "200":
          description: 서버 정상 동작 중
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                timestamp: "2024-11-15T09:00:00.000Z"

  # ── Books ────────────────────────────────────────────────────────────────────
  /books:
    get:
      tags: [Books]
      summary: 도서 목록 조회
      operationId: listBooks
      description: |
        전체 도서 목록을 조회합니다. 다양한 필터와 페이징을 지원합니다.

        **필터 조합 예시:**
        - `?genre=Technology` — Technology 장르만
        - `?available=true` — 대출 가능한 도서만
        - `?author=Martin` — 저자명에 "Martin" 포함
        - `?genre=Technology&available=true&page=1&limit=5` — 복합 조건
      parameters:
        - $ref: "#/components/parameters/QueryGenre"
        - $ref: "#/components/parameters/QueryAvailable"
        - $ref: "#/components/parameters/QueryAuthor"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: 도서 목록 (페이징 정보 포함)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookListResponse"
              examples:
                allBooks:
                  summary: 전체 목록 (기본)
                  value:
                    total: 5
                    page: 1
                    limit: 10
                    totalPages: 1
                    data:
                      - id: b001
                        title: Clean Code
                        author: Robert C. Martin
                        isbn: "978-0132350884"
                        genre: Technology
                        publishedYear: 2008
                        available: true
                        stock: 3
                      - id: b002
                        title: The Pragmatic Programmer
                        author: "David Thomas, Andrew Hunt"
                        isbn: "978-0135957059"
                        genre: Technology
                        publishedYear: 2019
                        available: true
                        stock: 2
                      - id: b003
                        title: Design Patterns
                        author: Gang of Four
                        isbn: "978-0201633610"
                        genre: Technology
                        publishedYear: 1994
                        available: false
                        stock: 0
                technologyAvailable:
                  summary: Technology 장르, 대출 가능만
                  value:
                    total: 2
                    page: 1
                    limit: 10
                    totalPages: 1
                    data:
                      - id: b001
                        title: Clean Code
                        author: Robert C. Martin
                        isbn: "978-0132350884"
                        genre: Technology
                        publishedYear: 2008
                        available: true
                        stock: 3
                      - id: b002
                        title: The Pragmatic Programmer
                        author: "David Thomas, Andrew Hunt"
                        isbn: "978-0135957059"
                        genre: Technology
                        publishedYear: 2019
                        available: true
                        stock: 2
                paged:
                  summary: 페이징 (limit=2, page=2)
                  value:
                    total: 5
                    page: 2
                    limit: 2
                    totalPages: 3
                    data:
                      - id: b003
                        title: Design Patterns
                        author: Gang of Four
                        isbn: "978-0201633610"
                        genre: Technology
                        publishedYear: 1994
                        available: false
                        stock: 0
                      - id: b004
                        title: Sapiens
                        author: Yuval Noah Harari
                        isbn: "978-0062316097"
                        genre: History
                        publishedYear: 2011
                        available: true
                        stock: 5

    post:
      tags: [Books]
      summary: 도서 등록
      operationId: createBook
      description: |
        새로운 도서를 등록합니다.

        **필수 필드:** `title`, `author`, `isbn`
        **선택 필드:** `genre` (기본값: `Uncategorized`), `publishedYear`, `stock` (기본값: `1`)

        동일 ISBN이 이미 존재하는 경우 `409 Conflict`를 반환합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreateRequest"
            examples:
              fullFields:
                summary: 모든 필드 포함
                value:
                  title: "Refactoring: Improving the Design of Existing Code"
                  author: Martin Fowler
                  isbn: "978-0134757599"
                  genre: Technology
                  publishedYear: 2018
                  stock: 3
              requiredOnly:
                summary: 필수 필드만 (genre/year 생략)
                value:
                  title: The Art of War
                  author: Sun Tzu
                  isbn: "978-0195014761"
              fiction:
                summary: 소설 등록
                value:
                  title: "1984"
                  author: George Orwell
                  isbn: "978-0451524935"
                  genre: Fiction
                  publishedYear: 1949
                  stock: 5
      responses:
        "201":
          description: 도서 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
              examples:
                created:
                  summary: 등록 성공 응답
                  value:
                    id: ba3f2c1d
                    title: "Refactoring: Improving the Design of Existing Code"
                    author: Martin Fowler
                    isbn: "978-0134757599"
                    genre: Technology
                    publishedYear: 2018
                    available: true
                    stock: 3
                createdMinimal:
                  summary: 필수 필드만 등록 시
                  value:
                    id: cb5d3e2f
                    title: The Art of War
                    author: Sun Tzu
                    isbn: "978-0195014761"
                    genre: Uncategorized
                    publishedYear: null
                    available: true
                    stock: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: ISBN 중복
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorIsbnConflict"
              example:
                error: A book with this ISBN already exists
                isbn: "978-0134757599"

  /books/{bookId}:
    parameters:
      - $ref: "#/components/parameters/PathBookId"

    get:
      tags: [Books]
      summary: 도서 단건 조회
      operationId: getBook
      description: ID로 특정 도서의 상세 정보를 조회합니다.
      responses:
        "200":
          description: 도서 상세 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
              examples:
                available:
                  summary: 대출 가능한 도서
                  value:
                    id: b001
                    title: Clean Code
                    author: Robert C. Martin
                    isbn: "978-0132350884"
                    genre: Technology
                    publishedYear: 2008
                    available: true
                    stock: 3
                unavailable:
                  summary: 대출 중인 도서 (stock=0)
                  value:
                    id: b003
                    title: Design Patterns
                    author: Gang of Four
                    isbn: "978-0201633610"
                    genre: Technology
                    publishedYear: 1994
                    available: false
                    stock: 0
        "404":
          $ref: "#/components/responses/BookNotFound"

    put:
      tags: [Books]
      summary: 도서 전체 수정
      operationId: replaceBook
      description: |
        도서의 모든 필드를 교체합니다 (PUT semantics).
        제공하지 않은 필드는 기존 값이 유지됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdateRequest"
            example:
              title: "Clean Code (개정판)"
              author: Robert C. Martin
              isbn: "978-0132350884"
              genre: Technology
              publishedYear: 2008
              available: true
              stock: 5
      responses:
        "200":
          description: 수정된 도서 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
              example:
                id: b001
                title: "Clean Code (개정판)"
                author: Robert C. Martin
                isbn: "978-0132350884"
                genre: Technology
                publishedYear: 2008
                available: true
                stock: 5
        "404":
          $ref: "#/components/responses/BookNotFound"

    patch:
      tags: [Books]
      summary: 도서 부분 수정
      operationId: updateBook
      description: |
        도서의 특정 필드만 업데이트합니다 (PATCH semantics).

        **stock 자동 동기화:** `stock` 값을 변경하면 `available` 플래그가 자동으로 업데이트됩니다.
        - `stock > 0` → `available: true`
        - `stock = 0` → `available: false`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookPatchRequest"
            examples:
              increaseStock:
                summary: 재고 증가
                value:
                  stock: 5
              zeroStock:
                summary: 재고 소진 (available 자동 false)
                value:
                  stock: 0
              changeGenre:
                summary: 장르 변경
                value:
                  genre: "Classic Fiction"
              multipleFields:
                summary: 복수 필드 변경
                value:
                  stock: 10
                  genre: "Classic Fiction"
      responses:
        "200":
          description: 수정된 도서 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
              examples:
                stockIncreased:
                  summary: 재고 증가 후
                  value:
                    id: b002
                    title: The Pragmatic Programmer
                    author: "David Thomas, Andrew Hunt"
                    isbn: "978-0135957059"
                    genre: Technology
                    publishedYear: 2019
                    available: true
                    stock: 5
                stockZero:
                  summary: 재고 소진 후 (available 자동 false)
                  value:
                    id: b004
                    title: Sapiens
                    author: Yuval Noah Harari
                    isbn: "978-0062316097"
                    genre: History
                    publishedYear: 2011
                    available: false
                    stock: 0
        "404":
          $ref: "#/components/responses/BookNotFound"

    delete:
      tags: [Books]
      summary: 도서 삭제
      operationId: deleteBook
      description: |
        도서를 삭제합니다.

        **주의:** 현재 대출 중인 도서(active loan 존재)는 삭제할 수 없습니다.
        먼저 반납 처리 후 삭제하세요.
      responses:
        "200":
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDeleteResponse"
              example:
                message: Book deleted successfully
                book:
                  id: b005
                  title: The Great Gatsby
                  author: F. Scott Fitzgerald
                  isbn: "978-0743273565"
                  genre: Fiction
                  publishedYear: 1925
                  available: true
                  stock: 4
        "404":
          $ref: "#/components/responses/BookNotFound"
        "409":
          description: 대출 중인 도서 삭제 불가
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorActiveLoans"
              example:
                error: Cannot delete book with active loans
                activeLoans: 1

  # ── Loans ────────────────────────────────────────────────────────────────────
  /loans:
    get:
      tags: [Loans]
      summary: 대출 목록 조회
      operationId: listLoans
      description: |
        전체 대출 기록을 조회합니다. 상태 및 도서 ID로 필터링할 수 있습니다.
      parameters:
        - $ref: "#/components/parameters/QueryLoanStatus"
        - $ref: "#/components/parameters/QueryLoanBookId"
      responses:
        "200":
          description: 대출 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanListResponse"
              examples:
                allLoans:
                  summary: 전체 대출 목록
                  value:
                    total: 1
                    data:
                      - id: l001
                        bookId: b003
                        borrowerName: Alice Kim
                        borrowerEmail: alice@example.com
                        loanDate: "2024-11-01"
                        dueDate: "2024-11-15"
                        returnDate: null
                        status: active
                activeOnly:
                  summary: 활성 대출만 (?status=active)
                  value:
                    total: 1
                    data:
                      - id: l001
                        bookId: b003
                        borrowerName: Alice Kim
                        borrowerEmail: alice@example.com
                        loanDate: "2024-11-01"
                        dueDate: "2024-11-15"
                        returnDate: null
                        status: active
                returnedOnly:
                  summary: 반납 완료만 (?status=returned)
                  value:
                    total: 0
                    data: []

    post:
      tags: [Loans]
      summary: 도서 대출 신청
      operationId: createLoan
      description: |
        도서를 대출합니다.

        **필수 필드:** `bookId`, `borrowerName`, `borrowerEmail`
        **선택 필드:** `daysToLoan` (기본값: `14`)

        대출 성공 시 해당 도서의 `stock` 이 1 감소하고, `stock=0` 이 되면 `available: false` 로 전환됩니다.

        **실패 조건:**
        - 도서를 찾을 수 없음 → `404`
        - 재고 없음 (`stock=0` 또는 `available=false`) → `409`
        - 필수 필드 누락 → `400`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanCreateRequest"
            examples:
              standard14Days:
                summary: 기본 대출 (14일)
                value:
                  bookId: b001
                  borrowerName: 홍길동
                  borrowerEmail: hong@example.com
                  daysToLoan: 14
              short7Days:
                summary: 단기 대출 (7일)
                value:
                  bookId: b002
                  borrowerName: 김민지
                  borrowerEmail: minji.kim@corp.com
                  daysToLoan: 7
              defaultDays:
                summary: daysToLoan 생략 (기본 14일)
                value:
                  bookId: b004
                  borrowerName: 이철수
                  borrowerEmail: cs.lee@corp.com
      responses:
        "201":
          description: 대출 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanCreateResponse"
              examples:
                success:
                  summary: 대출 성공 (재고 2→1)
                  value:
                    loan:
                      id: l8f3a2b1
                      bookId: b001
                      borrowerName: 홍길동
                      borrowerEmail: hong@example.com
                      loanDate: "2024-11-15"
                      dueDate: "2024-11-29"
                      returnDate: null
                      status: active
                    book:
                      id: b001
                      title: Clean Code
                      available: true
                      stock: 2
                lastStock:
                  summary: 마지막 재고 대출 (stock 1→0, available false)
                  value:
                    loan:
                      id: lae5c4d3
                      bookId: b002
                      borrowerName: 이철수
                      borrowerEmail: cs.lee@corp.com
                      loanDate: "2024-11-15"
                      dueDate: "2024-11-29"
                      returnDate: null
                      status: active
                    book:
                      id: b002
                      title: The Pragmatic Programmer
                      available: false
                      stock: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: 도서를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Book not found
        "409":
          description: 재고 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBookUnavailable"
              example:
                error: Book is not available for loan
                bookId: b003

  /loans/{loanId}:
    parameters:
      - $ref: "#/components/parameters/PathLoanId"

    get:
      tags: [Loans]
      summary: 대출 단건 조회
      operationId: getLoan
      description: ID로 특정 대출 기록을 조회합니다.
      responses:
        "200":
          description: 대출 상세 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"
              examples:
                active:
                  summary: 대출 중
                  value:
                    id: l001
                    bookId: b003
                    borrowerName: Alice Kim
                    borrowerEmail: alice@example.com
                    loanDate: "2024-11-01"
                    dueDate: "2024-11-15"
                    returnDate: null
                    status: active
                returned:
                  summary: 반납 완료
                  value:
                    id: l001
                    bookId: b003
                    borrowerName: Alice Kim
                    borrowerEmail: alice@example.com
                    loanDate: "2024-11-01"
                    dueDate: "2024-11-15"
                    returnDate: "2024-11-14"
                    status: returned
        "404":
          $ref: "#/components/responses/LoanNotFound"

  /loans/{loanId}/return:
    parameters:
      - $ref: "#/components/parameters/PathLoanId"

    patch:
      tags: [Loans]
      summary: 도서 반납
      operationId: returnLoan
      description: |
        대출 중인 도서를 반납합니다.

        반납 성공 시:
        - `loan.status` → `"returned"`
        - `loan.returnDate` → 반납일 (오늘 날짜)
        - 해당 도서의 `stock` +1, `available: true` 로 자동 전환

        이미 반납된 대출에 재반납 시도 시 `409 Conflict`
      responses:
        "200":
          description: 반납 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanReturnResponse"
              example:
                message: Book returned successfully
                loan:
                  id: l001
                  bookId: b003
                  borrowerName: Alice Kim
                  borrowerEmail: alice@example.com
                  loanDate: "2024-11-01"
                  dueDate: "2024-11-15"
                  returnDate: "2024-11-14"
                  status: returned
        "404":
          $ref: "#/components/responses/LoanNotFound"
        "409":
          description: 이미 반납된 대출
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                error: Book already returned

  # ── Products ─────────────────────────────────────────────────────────────────
  /products:
    get:
      tags: [Products]
      summary: Product 목록 조회
      operationId: listProducts
      description: |
        전체 Product 목록을 조회합니다.
        상태, 공개 범위, 카테고리, 이름 검색 필터와 페이지네이션을 지원합니다.
      parameters:
        - name: status
          in: query
          description: "배포 상태 필터 (draft | review | published | rejected | deprecated)"
          schema: { type: string, enum: [draft, review, published, rejected, deprecated] }
        - name: visibility
          in: query
          description: "공개 범위 필터 (public | authenticated | custom)"
          schema: { type: string, enum: [public, authenticated, custom] }
        - name: category
          in: query
          description: 카테고리 부분 일치 검색
          schema: { type: string }
        - name: nameSearch
          in: query
          description: 이름/제목 부분 일치 검색
          schema: { type: string }
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Product 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductListResponse" }
    post:
      tags: [Products]
      summary: Product 생성
      operationId: createProduct
      description: |
        새 Product를 **초안(draft)** 상태로 생성합니다.
        배포하려면 `/products/{id}/submit` → `/products/{id}/publish` 흐름을 따르세요.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
            example:
              name: "odata-product"
              title: "OData Catalog Product"
              description: "제품 카탈로그 OData API 상품"
              visibility: "public"
              categories: ["catalog", "odata"]
      responses:
        "201":
          description: 생성된 Product (draft 상태)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: 필수 필드 누락 또는 유효성 오류
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: 동일 name의 Product가 이미 존재
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Product ID (예 PROD-001)
        schema: { type: string }
    get:
      tags: [Products]
      summary: Product 단건 조회
      operationId: getProduct
      description: 특정 Product를 ID로 조회합니다. 연결된 Plan 목록도 함께 반환합니다.
      responses:
        "200":
          description: Product 상세 (plans 포함)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404":
          description: Product를 찾을 수 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    put:
      tags: [Products]
      summary: Product 전체 수정
      operationId: replaceProduct
      description: Product를 전체 수정합니다. **draft** 또는 **rejected** 상태에서만 가능합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
