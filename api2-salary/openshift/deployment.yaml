# ── API 2: Salary Management API — OpenShift Deployment ──────────────────────
# namespace: sample-apis
# Keycloak 연동 설정은 아래 env 섹션 또는 ConfigMap/Secret으로 주입합니다.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: salary-api
  namespace: sample-apis
  labels:
    app: salary-api
    app.kubernetes.io/part-of: sample-apis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: salary-api
  template:
    metadata:
      labels:
        app: salary-api
    spec:
      containers:
        - name: salary-api
          image: image-registry.openshift-image-registry.svc:5000/sample-apis/salary-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            # ── 필수: Keycloak 연동 설정 ──────────────────────────────────────
            # ConfigMap에서 주입 (민감하지 않은 설정)
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: salary-api-config
                  key: keycloak-url
            - name: KEYCLOAK_REALM
              valueFrom:
                configMapKeyRef:
                  name: salary-api-config
                  key: keycloak-realm
            - name: KEYCLOAK_AUDIENCE
              valueFrom:
                configMapKeyRef:
                  name: salary-api-config
                  key: keycloak-audience
            # ── 선택: API Connect outbound 토큰 헤더 이름 ────────────────────
            - name: TOKEN_HEADER_NAME
              valueFrom:
                configMapKeyRef:
                  name: salary-api-config
                  key: token-header-name
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      securityContext:
        seccompProfile:
          type: RuntimeDefault
