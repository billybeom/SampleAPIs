# host 값을 실제 클러스터 도메인으로 교체하세요.
#   예) salary-api.apps.your-cluster.example.com
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: salary-api
  namespace: sample-apis
  labels:
    app: salary-api
spec:
  host: salary-api.apps.your-cluster.example.com
  to:
    kind: Service
    name: salary-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
