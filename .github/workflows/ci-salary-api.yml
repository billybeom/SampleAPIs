# =============================================================================
# .github/workflows/ci-salary-api.yml
#
# Salary Management API (API 2) — CI/CD Pipeline
#
# 트리거:
#   - api2-salary/** 경로 변경 시 PR/push
#   - main 브랜치 push 시 Docker 이미지 빌드 & 푸시
#
# 단계:
#   1. lint        : Ruff 코드 검사 + isort 정렬 확인
#   2. test        : pytest 단위 테스트 (추후 추가 시 활성화)
#   3. openapi-lint: Spectral로 OpenAPI 명세서 검증
#   4. docker-build: Docker 이미지 빌드 테스트
#   5. docker-push : main 브랜치에서만 이미지 레지스트리 푸시
# =============================================================================

name: CI — Salary API

on:
  push:
    branches: [main, develop]
    paths:
      - "api2-salary/**"
      - ".github/workflows/ci-salary-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api2-salary/**"

env:
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/salary-api
  PYTHON_VERSION: "3.11"

jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Python Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api2-salary

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: api2-salary/requirements.txt

      - name: Install lint tools
        run: pip install ruff

      - name: Ruff lint
        run: ruff check app/ --output-format=github

      - name: Ruff format check
        run: ruff format app/ --check

  # ── 2. Unit Test (pytest) ─────────────────────────────────────────────────
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api2-salary

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: api2-salary/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        env:
          KEYCLOAK_URL: http://localhost:8080    # 테스트에서 mock으로 처리
          KEYCLOAK_REALM: corp
          KEYCLOAK_AUDIENCE: salary-api
        run: |
          # tests/ 폴더가 없으면 스킵
          if [ -d tests/ ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests found — skipping. Create api2-salary/tests/ to add tests."
          fi

  # ── 3. OpenAPI Lint ────────────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI Spectral Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec
        run: |
          spectral lint api2-salary/openapi.yaml \
            --ruleset https://unpkg.com/@stoplight/spectral-owasp-ruleset/dist/ruleset.mjs \
            --fail-severity warn

  # ── 4. Docker Build Test ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: api2-salary
          file: api2-salary/Dockerfile
          push: false
          tags: ${{ env.IMAGE_FULL }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Docker Push (main 브랜치만) ─────────────────────────────────────────
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api2-salary
          file: api2-salary/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
