# =============================================================================
# .github/workflows/ci-tours-api.yml
#
# Tours Management API (API 3) — CI/CD Pipeline
#
# 트리거:
#   - api3-tours/** 경로 변경 시 PR/push
#   - main 브랜치 push 시 Docker 이미지 빌드 & 푸시
#
# 단계:
#   1. lint        : ESLint 코드 검사
#   2. openapi-lint: Spectral로 OpenAPI 명세서 검증
#   3. docker-build: Docker 이미지 빌드 테스트
#   4. docker-push : main 브랜치에서만 이미지 레지스트리 푸시
# =============================================================================

name: CI — Tours API

on:
  push:
    branches: [main, develop]
    paths:
      - "api3-tours/**"
      - ".github/workflows/ci-tours-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "api3-tours/**"

env:
  IMAGE_NAME: tours-api
  # GitHub Container Registry 사용 시: ghcr.io/${{ github.repository_owner }}/tours-api
  # Docker Hub 사용 시: ${{ secrets.DOCKERHUB_USERNAME }}/tours-api
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/tours-api

defaults:
  run:
    working-directory: api3-tours

jobs:

  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api3-tours/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings 0 || echo "ESLint not configured, skipping"

  # ── 2. OpenAPI Lint ────────────────────────────────────────────────────────
  openapi-lint:
    name: OpenAPI Spectral Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Lint OpenAPI spec
        run: spectral lint openapi.yaml --ruleset ../.spectral.yaml --fail-severity error
        working-directory: api3-tours

  # ── 3. Docker Build Test ───────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v5
        with:
          context: api3-tours
          file: api3-tours/Dockerfile
          push: false
          tags: ${{ env.IMAGE_FULL }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 4. Docker Push (main 브랜치만) ─────────────────────────────────────────
  docker-push:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [lint, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FULL }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: api3-tours
          file: api3-tours/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
