name: CI — Tours GraphQL API

on:
  push:
    paths:
      - "api4-graphql/**"
      - ".github/workflows/ci-graphql-api.yml"
  pull_request:
    paths:
      - "api4-graphql/**"

jobs:
  test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api4-graphql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api4-graphql/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start server (background)
        run: |
          node src/index.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health)
          echo "Health status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Health check failed" && exit 1)

      - name: GraphQL — cruises query
        run: |
          RESULT=$(curl -s -X POST http://localhost:4000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ cruises { total items { cruiseID title } } }"}')
          echo "$RESULT"
          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['data']['cruises']['total']==3, 'Expected 3 cruises'"

      - name: GraphQL — single booking with relations
        run: |
          RESULT=$(curl -s -X POST http://localhost:4000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ booking(bookingID: \"1001\") { status cruise { title } customer { fullName } room { roomID details { pricePerNight } } } }"}')
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          b=d['data']['booking']
          assert b['status']=='CONFIRMED'
          assert b['cruise']['title']=='Mediterranean Discovery'
          assert b['customer']['fullName']=='Alice Smith'
          assert b['room']['details']['pricePerNight']==220
          print('All assertions passed')
          "

      - name: GraphQL — createBooking mutation
        run: |
          RESULT=$(curl -s -X POST http://localhost:4000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { createBooking(input: { cruiseID: \"CRUISE-002\", customerID: \"carol@tours.com\", room: { roomID: BAL, numRooms: 1 }, numPassengers: 2 }) { success message booking { bookingID } } }"}')
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d['data']['createBooking']['success']==True
          print('createBooking mutation passed')
          "

      - name: GraphQL — error case (invalid cruise)
        run: |
          RESULT=$(curl -s -X POST http://localhost:4000/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { createBooking(input: { cruiseID: \"CRUISE-999\", customerID: \"alice@tours.com\", room: { roomID: INT, numRooms: 1 }, numPassengers: 1 }) { success message } }"}')
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          assert d['data']['createBooking']['success']==False
          print('Error case handled correctly')
          "

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tours-graphql-api:ci ./api4-graphql

      - name: Docker smoke test
        run: |
          docker run -d --name tours-graphql-api-ci -p 4000:4000 tours-graphql-api:ci
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health)
          echo "Docker health status: $STATUS"
          [ "$STATUS" = "200" ] || (echo "Docker health check failed" && exit 1)
          docker rm -f tours-graphql-api-ci
