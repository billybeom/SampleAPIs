      summary: 연봉 레코드 삭제
      operationId: deleteSalary
      responses:
        "204": {description: 삭제 완료}
        "403": {description: 권한 없음}

components:
  securitySchemes:
    keycloak-oauth2:
      type: oauth2
      description: Keycloak OAuth 2.0 — webMethods identify-and-authorize 연동
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.example.com/realms/corp/protocol/openid-connect/token
          scopes:
            openid:  OpenID 기본 스코프
            profile: 사용자 프로필
  schemas:
    SalaryRecord:
      type: object
      properties:
        employee_id: {type: string}
        name:        {type: string}
        team:        {type: string}
        base_salary: {type: integer}
        bonus:       {type: integer}
        currency:    {type: string}
        updated_at:  {type: string, format: date-time}
    SalaryUpdate:
      type: object
      properties:
        base_salary: {type: integer}
        bonus:       {type: integer}
    UserInfo:
      type: object
      properties:
        id:       {type: string}
        username: {type: string}
        email:    {type: string}
        role:     {type: string, enum: [employee, manager, hr_system]}
        team:     {type: string}
    HealthResponse:
      type: object
      properties:
        status:    {type: string}
        timestamp: {type: string, format: date-time}
