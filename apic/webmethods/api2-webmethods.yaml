      operationId: updateSalary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalaryUpdate"}
      responses:
        "200":
          description: 수정된 연봉
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "403": {description: 권한 없음}
