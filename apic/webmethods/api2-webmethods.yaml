              body: '{"detail":"백엔드 서비스에 연결할 수 없습니다."}'

  cors:
    enabled: true

paths:
  /health:
    get:
      summary: 헬스 체크
      operationId: health
      security: []
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}

  /auth/me:
    get:
      summary: 현재 인증된 사용자 정보
      operationId: getMe
      responses:
        "200":
          description: 사용자 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserInfo"}
        "401": {description: 인증 실패}

  /salaries/me:
    get:
      summary: 내 연봉 조회
      operationId: getMySalary
      responses:
        "200":
          description: 내 연봉 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "401": {description: 인증 실패}
    put:
      summary: 내 연봉 수정
      operationId: updateMySalary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalaryUpdate"}
      responses:
        "200":
          description: 수정된 연봉
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "403": {description: 권한 없음}

  /salaries/team:
    get:
      summary: 팀 연봉 목록
      operationId: getTeamSalaries
      responses:
        "200":
          description: 팀 연봉 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SalaryRecord"}}
        "403": {description: 권한 없음}

  /salaries:
    get:
      summary: 전체 연봉 목록 (hr_system)
      operationId: getAllSalaries
      responses:
        "200":
          description: 전체 연봉 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SalaryRecord"}}
        "403": {description: 권한 없음}

  /salaries/{employee_id}:
    parameters:
      - {name: employee_id, in: path, required: true, schema: {type: string}}
    get:
      summary: 특정 직원 연봉 조회
      operationId: getSalary
