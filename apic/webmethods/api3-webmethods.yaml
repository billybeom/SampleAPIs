# =============================================================================
# IBM API Connect — webMethods API Gateway
# API 3: Tours Management API (여행 상품/고객/예약 관리)
# API 4: GraphQL Product API
# API 5: OData 4.0 Product Catalog API
#
# 이 파일은 api3, api4, api5 의 webMethods 배포 명세를 포함합니다.
# 각 API는 Swagger 2.0 + OpenAPI 3.0 명세를 함께 제공합니다.
# =============================================================================

# ╔═══════════════════════════════════════════════════════════════════════╗
# ║ API 3: Tours Management API                                         ║
# ╚═══════════════════════════════════════════════════════════════════════╝

# =====================================================================
# --- Swagger 2.0 명세 (API 3) ---
# =====================================================================
swagger: "2.0"
info:
  title: Tours Management API
  description: |
    여행 상품(크루즈) / 고객 / 예약 관리 REST API — webMethods API Gateway 샘플
    백엔드: http://tours-api:3002
    주의: /customers/:id 의 id는 emailAddress 입니다.
  version: "1.0.0"
  x-ibm-name: tours-management-api-wm

basePath: /tours/v1
schemes: [https]
consumes: [application/json]
produces: [application/json]
security: []
securityDefinitions: {}

x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: webmethods-api-gateway

  assembly:
    execute:
      - rate-limiter:
          version: 2.0.0
          title: Rate Limiter
          rate: {count: 200, interval: 60}
          burst: {count: 30, interval: 1}
          reject-message: 요청 한도를 초과했습니다.
      - request-transformation:
          version: 2.0.0
          title: Inject Gateway Headers
          transformations:
            - {type: set-header, name: X-API-Gateway, value: IBM-webMethods-API-Gateway}
            - {type: set-header, name: X-Request-ID,  value: $(request.headers.x-request-id)}
      - invoke:
          version: 2.0.0
          title: Invoke Tours Backend
          url: http://tours-api:3002$(request.path)$(request.search)
          verb: keep
          timeout: 30
          forward-response: true
      - log:
          version: 2.0.0
          title: Log Request
          log-level: info
          destination: api-gateway-log
    catch:
      - errors: [ConnectionError]
        execute:
          - response-transformation:
              version: 2.0.0
              title: Service Unavailable
              status-code: 503
              body: '{"error":"백엔드 서비스에 연결할 수 없습니다."}'
  cors:
    enabled: true

paths:
  /cruises:
    get:
      summary: 크루즈 목록 조회
      operationId: listCruises
      parameters:
        - {name: startDate,  in: query, type: string, format: date}
        - {name: endDate,    in: query, type: string, format: date}
        - {name: startPort,  in: query, type: string}
        - {name: numDays,    in: query, type: integer}
      responses:
        "200": {description: 크루즈 목록}
  /cruises/{id}:
    parameters:
      - {name: id, in: path, required: true, type: string}
    get:
      summary: 크루즈 단건 조회
      operationId: getCruise
      responses:
        "200": {description: 크루즈 정보}
        "404": {description: 크루즈를 찾을 수 없음}
  /customers:
    get:
      summary: 고객 목록
      operationId: listCustomers
      responses:
        "200": {description: 고객 목록}
    post:
      summary: 고객 생성
      operationId: createCustomer
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/CustomerInput"}}
      responses:
        "201": {description: 생성된 고객}
  /customers/{id}:
    parameters:
      - {name: id, in: path, required: true, type: string, description: "고객 이메일 주소"}
    get:
      summary: 고객 단건 조회 (id=emailAddress)
      operationId: getCustomer
      responses:
        "200": {description: 고객 정보}
        "404": {description: 고객을 찾을 수 없음}
    put:
      summary: 고객 수정
      operationId: updateCustomer
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/CustomerInput"}}
      responses:
        "200": {description: 수정된 고객}
    delete:
      summary: 고객 삭제
      operationId: deleteCustomer
      responses:
        "200": {description: 삭제 완료}
  /bookings:
    get:
      summary: 예약 목록
      operationId: listBookings
      parameters:
        - {name: cruiseID,   in: query, type: string}
        - {name: customerID, in: query, type: string}
      responses:
        "200": {description: 예약 목록}
    post:
      summary: 예약 생성
      operationId: createBooking
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/BookingInput"}}
      responses:
        "201": {description: 생성된 예약}
  /bookings/{id}:
    parameters:
      - {name: id, in: path, required: true, type: string}
    get:
      summary: 예약 단건 조회
      operationId: getBooking
      responses:
        "200": {description: 예약 정보}
        "404": {description: 예약을 찾을 수 없음}
    put:
      summary: 예약 수정
      operationId: updateBooking
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/BookingInput"}}
      responses:
        "200": {description: 수정된 예약}
    delete:
      summary: 예약 취소
      operationId: deleteBooking
      responses:
        "200": {description: 취소 완료}

definitions:
  CustomerInput:
    type: object
    required: [firstName, lastName, emailAddress]
    properties:
      firstName:    {type: string}
      lastName:     {type: string}
      emailAddress: {type: string, format: email}
      phoneNumber:  {type: string}
  BookingInput:
    type: object
    required: [cruiseID, customerID]
    properties:
      cruiseID:      {type: string}
      customerID:    {type: string}
      numPassengers: {type: integer, default: 1}
