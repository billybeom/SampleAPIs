paths:
  /:
    get:
      summary: OData 서비스 문서
      operationId: getServiceDocument
      responses:
        "200":
          description: OData 서비스 문서
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.context": {type: string}
                  value: {type: array, items: {type: object}}
  /$metadata:
    get:
      summary: OData $metadata (CSDL XML)
      operationId: getMetadata
      responses:
        "200":
          description: CSDL XML
          content:
            application/xml:
              schema: {type: string}
  /Products:
    get:
      summary: 제품 목록 조회
      operationId: listProducts
      parameters:
        - {name: "$filter",  in: query, schema: {type: string}}
        - {name: "$select",  in: query, schema: {type: string}}
        - {name: "$orderby", in: query, schema: {type: string}}
        - {name: "$top",     in: query, schema: {type: integer}}
        - {name: "$skip",    in: query, schema: {type: integer}}
        - {name: "$count",   in: query, schema: {type: string, enum: ["true","false"]}}
        - {name: "$expand",  in: query, schema: {type: string}}
      responses:
        "200":
          description: OData 제품 컬렉션
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.context": {type: string}
                  "@odata.count":   {type: integer}
                  value:
                    type: array
                    items: {$ref: "#/components/schemas/Product"}
    post:
      summary: 제품 생성
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "201":
          description: 생성된 제품
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
  /Products/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: 제품 단건 조회
      operationId: getProduct
      responses:
        "200":
          description: 제품 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
        "404": {description: 제품을 찾을 수 없음}
    patch:
      summary: 제품 부분 수정
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "204": {description: 수정 성공}
    delete:
      summary: 제품 삭제
      operationId: deleteProduct
      responses:
        "204": {description: 삭제 성공}
