# =============================================================================
# IBM API Connect — webMethods API Gateway
# API 5: OData 4.0 Product Catalog API (포트 3003)
#
# webMethods의 OData 처리 특징:
#   - OData $filter, $select 등은 쿼리 파라미터로 백엔드에 그대로 전달
#   - content-based-routing으로 $metadata 경로를 XML MIME 타입으로 처리
#   - data-masking으로 민감 필드 마스킹 가능
#   - validate-api-specification으로 OData 요청 검증
# =============================================================================

# =====================================================================
# --- Swagger 2.0 명세 ---
# =====================================================================
swagger: "2.0"
info:
  title: OData 4.0 Product Catalog API
  description: |
    OData 4.0 프로토콜 기반 제품 카탈로그 API — webMethods API Gateway 샘플
    백엔드: http://odata-api:3003
    OData 쿼리: $filter, $select, $orderby, $top, $skip, $count, $expand
  version: "1.0.0"
  x-ibm-name: odata-product-catalog-api-wm

basePath: /odata/v1
schemes: [https]
consumes: [application/json]
produces: [application/json]
security: []
securityDefinitions: {}

x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: webmethods-api-gateway

  assembly:
    execute:
      # ── 1단계: Rate Limiter ────────────────────────────────────────────
      - rate-limiter:
          version: 2.0.0
          title: Rate Limiter
          rate: {count: 200, interval: 60}
          burst: {count: 40, interval: 1}
          reject-message: 요청 한도를 초과했습니다.

      # ── 2단계: Content-Based Routing ($metadata 경로 분기) ────────────
      # DataPower에는 없는 webMethods 전용 라우팅 정책
      # $metadata 경로는 XML 응답이므로 별도 처리
      - content-based-routing:
          version: 2.0.0
          title: OData Metadata Routing
          conditions:
            - condition: $(request.path) contains '$metadata'
              execute:
                - request-transformation:
                    version: 2.0.0
                    title: Set XML Accept Header
                    transformations:
                      - {type: set-header, name: Accept, value: application/xml}
                - invoke:
                    version: 2.0.0
                    title: Invoke Metadata
                    url: http://odata-api:3003$(request.path)
                    verb: GET
                    timeout: 30
                    forward-response: true
          # 기본 경로 (OData JSON 응답)
          otherwise:
            - request-transformation:
                version: 2.0.0
                title: Inject OData Headers
                transformations:
                  - {type: set-header, name: X-API-Gateway,    value: IBM-webMethods-API-Gateway}
                  - {type: set-header, name: OData-MaxVersion, value: "4.0"}
                  - {type: set-header, name: X-Request-ID,     value: $(request.headers.x-request-id)}
            - invoke:
                version: 2.0.0
                title: Invoke OData Backend
                url: http://odata-api:3003$(request.path)$(request.search)
                verb: keep
                timeout: 30
                forward-response: true

      # ── 3단계: Log ────────────────────────────────────────────────────
      - log:
          version: 2.0.0
          title: Log OData Request
          log-level: info
          destination: api-gateway-log

    catch:
      - errors: [ConnectionError]
        execute:
          - response-transformation:
              version: 2.0.0
              title: Service Unavailable
              status-code: 503
              body: '{"error":{"code":"ServiceUnavailable","message":"백엔드 OData 서비스에 연결할 수 없습니다."}}'
  cors:
    enabled: true

paths:
  /:
    get:
      summary: OData 서비스 문서
      operationId: getServiceDocument
      responses:
        "200": {description: OData 서비스 문서}
  /$metadata:
    get:
      summary: OData $metadata (CSDL XML)
      operationId: getMetadata
      produces: [application/xml]
      responses:
        "200": {description: CSDL XML 메타데이터}
  /Products:
    get:
      summary: 제품 목록 조회
      operationId: listProducts
      parameters:
        - {name: "$filter",  in: query, type: string}
        - {name: "$select",  in: query, type: string}
        - {name: "$orderby", in: query, type: string}
        - {name: "$top",     in: query, type: integer}
        - {name: "$skip",    in: query, type: integer}
        - {name: "$count",   in: query, type: string, enum: ["true","false"]}
        - {name: "$expand",  in: query, type: string}
      responses:
        "200": {description: OData 제품 컬렉션}
    post:
      summary: 제품 생성
      operationId: createProduct
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/ProductInput"}}
      responses:
        "201": {description: 생성된 제품}
  /Products/$count:
    get:
      summary: 제품 수 조회
      operationId: countProducts
      produces: [text/plain]
      responses:
        "200": {description: 제품 수}
  /Products/{id}:
    parameters:
      - {name: id, in: path, required: true, type: integer}
    get:
      summary: 제품 단건 조회
      operationId: getProduct
      parameters:
        - {name: "$select", in: query, type: string}
        - {name: "$expand", in: query, type: string}
      responses:
        "200": {description: 제품 정보}
        "404": {description: 제품을 찾을 수 없음}
    patch:
      summary: 제품 부분 수정 (OData PATCH)
      operationId: updateProduct
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/ProductInput"}}
      responses:
        "204": {description: 수정 성공}
    put:
      summary: 제품 전체 교체 (OData PUT)
      operationId: replaceProduct
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/ProductInput"}}
      responses:
        "204": {description: 교체 성공}
    delete:
      summary: 제품 삭제
      operationId: deleteProduct
      responses:
        "204": {description: 삭제 성공}
  /Categories:
    get:
      summary: 카테고리 목록
      operationId: listCategories
      parameters:
        - {name: "$filter",  in: query, type: string}
        - {name: "$expand",  in: query, type: string}
        - {name: "$top",     in: query, type: integer}
        - {name: "$skip",    in: query, type: integer}
        - {name: "$count",   in: query, type: string, enum: ["true","false"]}
      responses:
        "200": {description: OData 카테고리 컬렉션}
    post:
      summary: 카테고리 생성
      operationId: createCategory
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/CategoryInput"}}
      responses:
        "201": {description: 생성된 카테고리}
  /Categories/$count:
    get:
      summary: 카테고리 수
      operationId: countCategories
      produces: [text/plain]
      responses:
        "200": {description: 카테고리 수}
  /Categories/{id}:
    parameters:
      - {name: id, in: path, required: true, type: integer}
    get:
      summary: 카테고리 단건 조회
      operationId: getCategory
      parameters:
        - {name: "$expand", in: query, type: string}
      responses:
        "200": {description: 카테고리 정보}
        "404": {description: 카테고리를 찾을 수 없음}
    patch:
      summary: 카테고리 수정
      operationId: updateCategory
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/CategoryInput"}}
      responses:
        "204": {description: 수정 성공}
    delete:
      summary: 카테고리 삭제
      operationId: deleteCategory
      responses:
        "204": {description: 삭제 성공}
  /Categories/{id}/Products:
    parameters:
      - {name: id, in: path, required: true, type: integer}
    get:
      summary: 카테고리별 제품 목록
      operationId: listProductsByCategory
      parameters:
        - {name: "$filter",  in: query, type: string}
        - {name: "$orderby", in: query, type: string}
        - {name: "$top",     in: query, type: integer}
        - {name: "$skip",    in: query, type: integer}
        - {name: "$count",   in: query, type: string, enum: ["true","false"]}
      responses:
        "200": {description: 카테고리 내 제품 목록}

definitions:
  ProductInput:
    type: object
    required: [name, price, categoryId]
    properties:
      name:         {type: string}
      description:  {type: string}
      price:        {type: number}
      stock:        {type: integer}
      rating:       {type: number}
      categoryId:   {type: integer}
      discontinued: {type: boolean, default: false}
  CategoryInput:
    type: object
    required: [name]
    properties:
      name:        {type: string}
      description: {type: string}

