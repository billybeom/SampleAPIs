# =============================================================================
# IBM API Connect — DataPower Nano Gateway
# API 5: OData 4.0 Product Catalog API (포트 3003)
# ⚠️  OAS 3.0 전용
#
# Nano Gateway의 OData 처리:
#   - If 정책으로 $metadata 경로를 XML Accept 헤더로 분기
#   - Transform 정책으로 OData 응답 헤더 추가
#   - DataPower의 content-routing, webMethods의 content-based-routing 대비
#     Nano는 If 정책(JSONata 조건)으로 경량 분기 처리
# =============================================================================

openapi: "3.0.3"
info:
  title: OData 4.0 Product Catalog API
  description: |
    OData 4.0 프로토콜 기반 제품 카탈로그 API — Nano Gateway 샘플
    백엔드: http://odata-api:3003
  version: "1.0.0"
  x-ibm-name: odata-product-catalog-api-nano

servers:
  - url: https://nano-gateway.example.com/odata/v1

x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: datapower-nano-gateway

  assembly:
    execute:
      # ── 1단계: RateLimit ──────────────────────────────────────────────
      - RateLimit:
          version: 2.0.0
          title: Rate Limit
          count: 200
          interval: 60
          unit: second
          hard-limit: true
          reject-message: 요청 한도를 초과했습니다.

      # ── 2단계: Cors ─────────────────────────────────────────────────
      - Cors:
          version: 2.0.0
          title: CORS Policy
          allow-origins: ["*"]
          allow-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          allow-headers: [Content-Type, OData-MaxVersion, X-Request-ID]
          max-age: 3600

      # ── 3단계: If ($metadata 경로 분기) ──────────────────────────────
      # DataPower: switch + set-variable 조합
      # webMethods: content-based-routing
      # Nano: If 정책 (JSONata 조건식)
      - If:
          version: 2.0.0
          title: OData Metadata Path Check
          # JSONata 조건식으로 $metadata 경로 확인
          condition: "$contains($request.path, '$metadata')"
          execute:
            - Set:
                version: 2.0.0
                title: Set XML Accept for Metadata
                headers:
                  Accept: "application/xml"
                  X-API-Gateway: "IBM-Nano-Gateway"
            - Invoke:
                version: 2.0.0
                title: Invoke Metadata Endpoint
                url: "http://odata-api:3003{$request.path}"
                verb: GET
                timeout: 30
                redirect-policy: follow

      # ── 4단계: Set (일반 OData 요청 헤더 주입) ───────────────────────
      # If 블록에 걸리지 않은 일반 OData 요청에 적용
      - Set:
          version: 2.0.0
          title: Set OData Headers
          headers:
            X-API-Gateway: "IBM-Nano-Gateway"
            OData-MaxVersion: "4.0"
            X-Request-ID: "$request.headers.\"x-request-id\""

      # ── 5단계: Invoke (일반 OData 백엔드 호출) ───────────────────────
      - Invoke:
          version: 2.0.0
          title: Invoke OData Backend
          url: "http://odata-api:3003{$request.path}{$request.queryString ? '?' & $request.queryString : ''}"
          verb: keep
          timeout: 30
          redirect-policy: follow

    catch:
      - errors: [ConnectionError]
        execute:
          - Set:
              version: 2.0.0
              title: Error Response
              status-code: 503
              body: '{"error":{"code":"ServiceUnavailable","message":"백엔드 OData 서비스에 연결할 수 없습니다."}}'

paths:
  /:
    get:
      summary: OData 서비스 문서
      operationId: getServiceDocument
      responses:
        "200":
          description: OData 서비스 문서
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.context": {type: string}
                  value: {type: array, items: {type: object}}

  /$metadata:
    get:
      summary: OData $metadata (CSDL XML)
      operationId: getMetadata
      responses:
        "200":
          description: CSDL XML
          content:
            application/xml:
              schema: {type: string}

  /Products:
    get:
      summary: 제품 목록 조회
      operationId: listProducts
      parameters:
        - {name: "$filter",  in: query, schema: {type: string}}
        - {name: "$select",  in: query, schema: {type: string}}
        - {name: "$orderby", in: query, schema: {type: string}}
        - {name: "$top",     in: query, schema: {type: integer}}
        - {name: "$skip",    in: query, schema: {type: integer}}
        - {name: "$count",   in: query, schema: {type: string, enum: ["true","false"]}}
        - {name: "$expand",  in: query, schema: {type: string}}
      responses:
        "200":
          description: OData 제품 컬렉션
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.context": {type: string}
                  "@odata.count":   {type: integer}
                  value: {type: array, items: {$ref: "#/components/schemas/Product"}}
    post:
      summary: 제품 생성
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "201":
          description: 생성된 제품
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}

  /Products/$count:
    get:
      summary: 제품 수 조회
      operationId: countProducts
      parameters:
        - {name: "$filter", in: query, schema: {type: string}}
      responses:
        "200":
          description: 제품 수
          content:
            text/plain:
              schema: {type: integer}

  /Products/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: 제품 단건 조회
      operationId: getProduct
      parameters:
        - {name: "$select", in: query, schema: {type: string}}
        - {name: "$expand", in: query, schema: {type: string}}
      responses:
        "200":
          description: 제품 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Product"}
        "404": {description: 제품을 찾을 수 없음}
    patch:
      summary: 제품 부분 수정
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProductInput"}
      responses:
        "204": {description: 수정 성공}
    delete:
      summary: 제품 삭제
      operationId: deleteProduct
      responses:
        "204": {description: 삭제 성공}

  /Categories:
    get:
      summary: 카테고리 목록 조회
      operationId: listCategories
      parameters:
        - {name: "$filter",  in: query, schema: {type: string}}
        - {name: "$expand",  in: query, schema: {type: string}}
        - {name: "$top",     in: query, schema: {type: integer}}
        - {name: "$skip",    in: query, schema: {type: integer}}
        - {name: "$count",   in: query, schema: {type: string, enum: ["true","false"]}}
      responses:
        "200":
          description: OData 카테고리 컬렉션
          content:
            application/json:
              schema:
                type: object
                properties:
                  "@odata.context": {type: string}
                  value: {type: array, items: {$ref: "#/components/schemas/Category"}}

  /Categories/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: 카테고리 단건 조회
      operationId: getCategory
      parameters:
        - {name: "$expand", in: query, schema: {type: string}}
      responses:
        "200":
          description: 카테고리 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Category"}
        "404": {description: 카테고리를 찾을 수 없음}

  /Categories/{id}/Products:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      summary: 카테고리별 제품 목록 (네비게이션 프로퍼티)
      operationId: listProductsByCategory
      parameters:
        - {name: "$filter",  in: query, schema: {type: string}}
        - {name: "$orderby", in: query, schema: {type: string}}
        - {name: "$top",     in: query, schema: {type: integer}}
        - {name: "$skip",    in: query, schema: {type: integer}}
      responses:
        "200":
          description: 카테고리 내 제품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: {type: array, items: {$ref: "#/components/schemas/Product"}}

components:
  schemas:
    Product:
      type: object
      properties:
        id:           {type: integer}
        name:         {type: string}
        description:  {type: string}
        price:        {type: number}
        stock:        {type: integer}
        rating:       {type: number, nullable: true}
        categoryId:   {type: integer}
        createdAt:    {type: string, format: date-time}
        discontinued: {type: boolean}
    ProductInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:         {type: string}
        description:  {type: string}
        price:        {type: number}
        stock:        {type: integer}
        categoryId:   {type: integer}
        discontinued: {type: boolean, default: false}
    Category:
      type: object
      properties:
        id:          {type: integer}
        name:        {type: string}
        description: {type: string}
