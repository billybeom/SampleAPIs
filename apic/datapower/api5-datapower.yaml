components:
  schemas:
    Product:
      type: object
      properties:
        id:           {type: integer}
        name:         {type: string}
        description:  {type: string}
        price:        {type: number}
        stock:        {type: integer}
        rating:       {type: number, nullable: true}
        categoryId:   {type: integer}
        createdAt:    {type: string, format: date-time}
        discontinued: {type: boolean}
    ProductInput:
      type: object
      required: [name, price, categoryId]
      properties:
        name:         {type: string}
        description:  {type: string}
        price:        {type: number}
        stock:        {type: integer, default: 0}
        rating:       {type: number, nullable: true}
        categoryId:   {type: integer}
        discontinued: {type: boolean, default: false}
    Category:
      type: object
      properties:
        id:          {type: integer}
        name:        {type: string}
        description: {type: string}
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:        {type: string}
        description: {type: string}
    ProductCollection:
      type: object
      properties:
        "@odata.context": {type: string}
        "@odata.count":   {type: integer}
        value:
          type: array
          items: {$ref: "#/components/schemas/Product"}
    CategoryCollection:
      type: object
      properties:
        "@odata.context": {type: string}
        "@odata.count":   {type: integer}
        value:
          type: array
          items: {$ref: "#/components/schemas/Category"}
    ServiceDocument:
      type: object
      properties:
        "@odata.context": {type: string}
        value:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              kind: {type: string}
              url:  {type: string}
