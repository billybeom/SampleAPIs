        "200": {description: 취소 완료}

components:
  schemas:
    Cruise:
      type: object
      properties:
        cruiseID:   {type: string}
        name:       {type: string}
        startPort:  {type: string}
        endPort:    {type: string}
        startDate:  {type: string, format: date}
        endDate:    {type: string, format: date}
        numDays:    {type: integer}
        price:      {type: number}
    Customer:
      type: object
      properties:
        customerID:   {type: string}
        firstName:    {type: string}
        lastName:     {type: string}
        emailAddress: {type: string, format: email}
        phoneNumber:  {type: string}
    CustomerInput:
      type: object
      required: [firstName, lastName, emailAddress]
      properties:
        firstName:    {type: string}
        lastName:     {type: string}
        emailAddress: {type: string, format: email}
        phoneNumber:  {type: string}
    Booking:
      type: object
      properties:
        bookingID:     {type: string}
        cruiseID:      {type: string}
        customerID:    {type: string}
        numPassengers: {type: integer}
        totalPrice:    {type: number}
        status:        {type: string, enum: [confirmed, cancelled]}
    BookingInput:
      type: object
      required: [cruiseID, customerID]
      properties:
        cruiseID:      {type: string}
        customerID:    {type: string}
        numPassengers: {type: integer, default: 1}
