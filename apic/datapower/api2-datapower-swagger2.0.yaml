# =============================================================================
# IBM API Connect — DataPower API Gateway
# API 2: Salary Management API (Keycloak OAuth2 + RBAC)
# Specification: Swagger 2.0
# =============================================================================

swagger: "2.0"
info:
  title: Salary Management API
  description: |
    연봉 관리 API — Keycloak OAuth2/OIDC + DataPower API Gateway RBAC 샘플
    백엔드: http://salary-api:8001
    역할: employee / manager / hr_system
  version: "2.0.0"
  x-ibm-name: salary-management-api-dp

basePath: /salary/v2
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  keycloak-oauth2:
    type: oauth2
    description: |
      Keycloak OAuth 2.0 (corp realm)
      API Connect 설정: Third-Party OAuth Provider
      Introspect URL: http://keycloak:8080/realms/corp/protocol/openid-connect/token/introspect
    flow: application
    tokenUrl: https://keycloak.example.com/realms/corp/protocol/openid-connect/token
    scopes:
      openid:  OpenID 기본 스코프
      profile: 사용자 프로필
      email:   이메일 주소

security:
  - keycloak-oauth2: [openid, profile]

x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: datapower-api-gateway

  assembly:
    execute:
      # ── 1단계: Rate Limit ──────────────────────────────────────────────
      - rate-limit:
          version: 2.0.0
          title: Rate Limit
          source: plan
          reject-message: 요청 한도를 초과했습니다.

      # ── 2단계: Parse (페이로드 파싱 + SQL Injection 탐지) ──────────────
      - parse:
          version: 2.0.0
          title: Parse Request
          parse-settings-reference:
            default: apic-default-parsesettings

      # ── 3단계: OAuth 토큰 검증 (방법 A — 주석 해제하여 활성화) ──────────
      # - oauth:
      #     version: 2.0.0
      #     title: Validate Keycloak Token
      #     provider: keycloak-corp          # API Connect 관리 콘솔에서 등록
      #     output: decoded-token

      # ── 4단계: Set Variable (헤더 구성) ───────────────────────────────
      - set-variable:
          version: 2.0.0
          title: Set Outbound Headers
          actions:
            - set: message.headers.X-API-Gateway
              value: IBM-DataPower-API-Gateway
              type: string
            - set: message.headers.X-Request-ID
              value: $(request.headers.x-request-id)
              type: string
            # Outbound Token 패턴: 클라이언트 토큰을 백엔드로 전달
            - set: message.headers.Authorization
              value: $(request.headers.authorization)
              type: string
            # oauth 정책 사용 시 decoded 클레임 전달 (방법 A)
            # - set: message.headers.X-User-Sub
            #   value: $(decoded-token.sub)
            #   type: string
            # - set: message.headers.X-User-Role
            #   value: $(decoded-token.realm_access.roles)
            #   type: string

      # ── 5단계: Invoke ─────────────────────────────────────────────────
      - invoke:
          version: 2.2.0
          title: Invoke Salary Backend
          target-url: $(target-url)$(request.path)$(request.search)
          verb: keep
          follow-redirects: false
          timeout: 30
          compression: false
          output: message

    catch:
      - errors: [ConnectionError, JavaScriptError]
        execute:
          - set-variable:
              version: 2.0.0
              title: Backend Unavailable
              actions:
                - set: message.status.code
                  value: 503
                  type: number
                - set: message.headers.Content-Type
                  value: application/json
                  type: string
                - set: message.body
                  value: '{"detail":"백엔드 서비스에 연결할 수 없습니다."}'
                  type: string

  properties:
    target-url:
      value: http://salary-api:8001
      description: 백엔드 Salary API URL
      encoded: false
    keycloak-introspect-url:
      value: http://keycloak:8080/realms/corp/protocol/openid-connect/token/introspect
      description: Keycloak 토큰 Introspect URL
      encoded: false

  cors:
    enabled: true

paths:
  /health:
    get:
      summary: 헬스 체크
      operationId: health
      security: []
      responses:
        "200": {description: 정상}

  /auth/me:
    get:
      summary: 현재 인증된 사용자 정보
      operationId: getMe
      responses:
        "200": {description: 사용자 정보}
        "401": {description: 인증 실패}

  /salaries/me:
    get:
      summary: 내 연봉 조회
      operationId: getMySalary
      responses:
        "200": {description: 내 연봉 정보}
        "401": {description: 인증 실패}
        "404": {description: 연봉 정보 없음}
    put:
      summary: 내 연봉 수정
      operationId: updateMySalary
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/SalaryUpdate"}}
      responses:
        "200": {description: 수정된 연봉}
        "403": {description: 권한 없음}

  /salaries/team:
    get:
      summary: 팀 연봉 목록 (manager/hr_system)
      operationId: getTeamSalaries
      responses:
        "200": {description: 팀 연봉 목록}
        "403": {description: 권한 없음}

  /salaries:
    get:
      summary: 전체 연봉 목록 (hr_system)
      operationId: getAllSalaries
      responses:
        "200": {description: 전체 연봉 목록}
        "403": {description: 권한 없음}

  /salaries/{employee_id}:
    parameters:
      - {name: employee_id, in: path, required: true, type: string}
    get:
      summary: 특정 직원 연봉 조회
      operationId: getSalary
      responses:
        "200": {description: 연봉 정보}
        "403": {description: 권한 없음}
        "404": {description: 연봉 정보 없음}
    put:
      summary: 특정 직원 연봉 수정
      operationId: updateSalary
      parameters:
        - {in: body, name: body, schema: {$ref: "#/definitions/SalaryUpdate"}}
      responses:
        "200": {description: 수정된 연봉}
        "403": {description: 권한 없음}
    delete:
      summary: 연봉 레코드 삭제 (hr_system)
      operationId: deleteSalary
      responses:
        "204": {description: 삭제 완료}
        "403": {description: 권한 없음}

definitions:
  SalaryUpdate:
    type: object
    properties:
      base_salary: {type: integer}
      bonus:       {type: integer}
  SalaryRecord:
    type: object
    properties:
      employee_id: {type: string}
      name:        {type: string}
      team:        {type: string}
      base_salary: {type: integer}
      bonus:       {type: integer}
      currency:    {type: string}
      updated_at:  {type: string, format: date-time}
