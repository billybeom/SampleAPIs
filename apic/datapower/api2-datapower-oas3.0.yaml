# =============================================================================
# IBM API Connect — DataPower API Gateway
# API 2: Salary Management API (Keycloak OAuth2 + RBAC)
# Specification: OpenAPI 3.0 (OAS 3.0.3)
# =============================================================================

openapi: "3.0.3"
info:
  title: Salary Management API
  description: |
    연봉 관리 API — Keycloak OAuth2/OIDC + DataPower API Gateway RBAC 샘플
    역할: employee / manager / hr_system
  version: "2.0.0"
  x-ibm-name: salary-management-api-dp-oas3

servers:
  - url: https://gateway.example.com/salary/v2
    description: DataPower API Gateway (운영)
  - url: https://gateway-dev.example.com/salary/v2
    description: DataPower API Gateway (개발)

security:
  - keycloak-oauth2: [openid, profile]

x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: datapower-api-gateway

  assembly:
    execute:
      - rate-limit:
          version: 2.0.0
          title: Rate Limit
          source: plan
          reject-message: 요청 한도를 초과했습니다.
      - parse:
          version: 2.0.0
          title: Parse Request
          parse-settings-reference:
            default: apic-default-parsesettings
      # oauth 정책 (방법 A — 주석 해제하여 활성화)
      # - oauth:
      #     version: 2.0.0
      #     title: Validate Keycloak Token
      #     provider: keycloak-corp
      #     output: decoded-token
      - set-variable:
          version: 2.0.0
          title: Set Outbound Headers
          actions:
            - set: message.headers.X-API-Gateway
              value: IBM-DataPower-API-Gateway
              type: string
            - set: message.headers.Authorization
              value: $(request.headers.authorization)
              type: string
      - invoke:
          version: 2.2.0
          title: Invoke Salary Backend
          target-url: $(target-url)$(request.path)$(request.search)
          verb: keep
          timeout: 30
          output: message

    catch:
      - errors: [ConnectionError]
        execute:
          - set-variable:
              version: 2.0.0
              title: Backend Unavailable
              actions:
                - set: message.status.code
                  value: 503
                  type: number
                - set: message.body
                  value: '{"detail":"백엔드 서비스에 연결할 수 없습니다."}'
                  type: string

  properties:
    target-url:
      value: http://salary-api:8001
      description: 백엔드 Salary API URL
      encoded: false

  cors:
    enabled: true

paths:
  /health:
    get:
      summary: 헬스 체크
      operationId: health
      security: []
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}

  /auth/me:
    get:
      summary: 현재 인증된 사용자 정보
      operationId: getMe
      responses:
        "200":
          description: 사용자 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UserInfo"}
        "401": {description: 인증 실패}

  /salaries/me:
    get:
      summary: 내 연봉 조회
      operationId: getMySalary
      responses:
        "200":
          description: 내 연봉 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "401": {description: 인증 실패}
        "404": {description: 연봉 정보 없음}
    put:
      summary: 내 연봉 수정
      operationId: updateMySalary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalaryUpdate"}
      responses:
        "200":
          description: 수정된 연봉
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "403": {description: 권한 없음}

  /salaries/team:
    get:
      summary: 팀 연봉 목록 (manager/hr_system)
      operationId: getTeamSalaries
      responses:
        "200":
          description: 팀 연봉 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SalaryRecord"}}
        "403": {description: 권한 없음}

  /salaries:
    get:
      summary: 전체 연봉 목록 (hr_system)
      operationId: getAllSalaries
      responses:
        "200":
          description: 전체 연봉 목록
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/SalaryRecord"}}
        "403": {description: 권한 없음}

  /salaries/{employee_id}:
    parameters:
      - {name: employee_id, in: path, required: true, schema: {type: string}}
    get:
      summary: 특정 직원 연봉 조회
      operationId: getSalary
      responses:
        "200":
          description: 연봉 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "403": {description: 권한 없음}
        "404": {description: 연봉 정보 없음}
    put:
      summary: 특정 직원 연봉 수정
      operationId: updateSalary
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SalaryUpdate"}
      responses:
        "200":
          description: 수정된 연봉
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SalaryRecord"}
        "403": {description: 권한 없음}
    delete:
      summary: 연봉 레코드 삭제 (hr_system)
      operationId: deleteSalary
      responses:
        "204": {description: 삭제 완료}
        "403": {description: 권한 없음}

components:
  securitySchemes:
    keycloak-oauth2:
      type: oauth2
      description: Keycloak OAuth 2.0 (corp realm) — Third-Party OAuth Provider
      flows:
        clientCredentials:
          tokenUrl: https://keycloak.example.com/realms/corp/protocol/openid-connect/token
          scopes:
            openid:  OpenID 기본 스코프
            profile: 사용자 프로필
            email:   이메일 주소
  schemas:
    SalaryRecord:
      type: object
      properties:
        employee_id: {type: string}
        name:        {type: string}
        team:        {type: string}
        base_salary: {type: integer}
        bonus:       {type: integer}
        currency:    {type: string}
        updated_at:  {type: string, format: date-time}
    SalaryUpdate:
      type: object
      properties:
        base_salary: {type: integer}
        bonus:       {type: integer}
    UserInfo:
      type: object
      properties:
        id:        {type: string}
        username:  {type: string}
        email:     {type: string}
        role:      {type: string, enum: [employee, manager, hr_system]}
        team:      {type: string}
    HealthResponse:
      type: object
      properties:
        status:    {type: string}
        timestamp: {type: string, format: date-time}
