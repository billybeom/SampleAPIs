# =============================================================================
# IBM API Connect — DataPower API Gateway
# API 1: Library Management API (인증 없음, 직관적 CRUD)
# Specification: OpenAPI 3.0 (OAS 3.0.3)
# =============================================================================

openapi: "3.0.3"
info:
  title: Library Management API
  description: |
    도서관 도서/대출 관리 REST API — DataPower API Gateway 샘플 (인증 없음)
    백엔드: http://library-api:3000
  version: "1.0.0"
  x-ibm-name: library-management-api-dp-oas3

servers:
  - url: https://gateway.example.com/library/v1
    description: DataPower API Gateway (운영)
  - url: https://gateway-dev.example.com/library/v1
    description: DataPower API Gateway (개발)

x-ibm-configuration:
  testable: true
  enforced: true
  phase: realized
  gateway: datapower-api-gateway

  assembly:
    execute:
      - rate-limit:
          version: 2.0.0
          title: Rate Limit
          source: plan
          reject-message: 요청 한도를 초과했습니다. 잠시 후 다시 시도하세요.
      - set-variable:
          version: 2.0.0
          title: Set Gateway Headers
          actions:
            - set: message.headers.X-API-Gateway
              value: IBM-DataPower-API-Gateway
              type: string
            - set: message.headers.X-Request-ID
              value: $(request.headers.x-request-id)
              type: string
      - invoke:
          version: 2.2.0
          title: Invoke Library Backend
          target-url: $(target-url)$(request.path)$(request.search)
          verb: keep
          follow-redirects: false
          timeout: 30
          output: message

    catch:
      - errors: [ConnectionError]
        execute:
          - set-variable:
              version: 2.0.0
              title: Backend Unavailable
              actions:
                - set: message.status.code
                  value: 503
                  type: number
                - set: message.body
                  value: '{"error":"백엔드 서비스에 연결할 수 없습니다."}'
                  type: string

  properties:
    target-url:
      value: http://library-api:3000
      description: 백엔드 Library API URL
      encoded: false

  cors:
    enabled: true

paths:
  /books:
    get:
      summary: 도서 목록 조회
      operationId: listBooks
      parameters:
        - {name: genre,     in: query, schema: {type: string}}
        - {name: available, in: query, schema: {type: boolean}}
        - {name: page,      in: query, schema: {type: integer, default: 1}}
        - {name: limit,     in: query, schema: {type: integer, default: 10}}
      responses:
        "200":
          description: 도서 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  data:  {type: array, items: {$ref: "#/components/schemas/Book"}}
    post:
      summary: 도서 등록
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookInput"}
      responses:
        "201":
          description: 등록된 도서
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}

  /books/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: 도서 단건 조회
      operationId: getBook
      responses:
        "200":
          description: 도서 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
        "404": {description: 도서를 찾을 수 없음}
    put:
      summary: 도서 전체 수정
      operationId: replaceBook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookInput"}
      responses:
        "200":
          description: 수정된 도서
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
    patch:
      summary: 도서 부분 수정
      operationId: updateBook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BookInput"}
      responses:
        "200":
          description: 수정된 도서
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Book"}
    delete:
      summary: 도서 삭제
      operationId: deleteBook
      responses:
        "204": {description: 삭제 완료}

  /loans:
    get:
      summary: 대출 목록 조회
      operationId: listLoans
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [active, returned]}}
        - {name: bookId, in: query, schema: {type: string}}
      responses:
        "200":
          description: 대출 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: {type: integer}
                  data:  {type: array, items: {$ref: "#/components/schemas/Loan"}}
    post:
      summary: 도서 대출
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoanInput"}
      responses:
        "201":
          description: 대출 정보
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loan"}

  /loans/{id}/return:
    patch:
      summary: 도서 반납
      operationId: returnLoan
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 반납 완료
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Loan"}

components:
  schemas:
    Book:
      type: object
      properties:
        id:            {type: string}
        title:         {type: string}
        author:        {type: string}
        isbn:          {type: string}
        genre:         {type: string}
        publishedYear: {type: integer}
        available:     {type: boolean}
        stock:         {type: integer}
    BookInput:
      type: object
      required: [title, author, isbn]
      properties:
        title:         {type: string}
        author:        {type: string}
        isbn:          {type: string}
        genre:         {type: string}
        publishedYear: {type: integer}
        stock:         {type: integer, default: 1}
    Loan:
      type: object
      properties:
        id:            {type: string}
        bookId:        {type: string}
        borrowerName:  {type: string}
        borrowerEmail: {type: string, format: email}
        loanDate:      {type: string, format: date}
        dueDate:       {type: string, format: date}
        returnDate:    {type: string, format: date, nullable: true}
        status:        {type: string, enum: [active, returned]}
    LoanInput:
      type: object
      required: [bookId, borrowerName, borrowerEmail]
      properties:
        bookId:        {type: string}
        borrowerName:  {type: string}
        borrowerEmail: {type: string, format: email}
        daysToLoan:    {type: integer, default: 14}
